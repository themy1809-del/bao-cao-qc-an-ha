<style>

.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:80;background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.gs{flex:1;max-width:420px;position:relative}
.gs input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:inherit}
.gs:before{content:'🔍';position:absolute;left:8px;top:7px;font-size:12px;opacity:.6}
.bell{position:relative;cursor:pointer;font-size:17px}

.user{display:flex;align-items:center;gap:8px}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.user .nm{font-weight:700;font-size:12.5px;line-height:1.2}
.user .rl{font-size:10.5px;color:var(--muted)}
main{padding:14px 18px;display:flex;flex-direction:column;gap:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:0 0 0}
.card h3{margin:0 0 6px;font-size:13.5px;font-weight:800}
.q{color:var(--muted);font-size:11.5px}
.muted{color:var(--muted)}
.cg-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 16px rgba(16,24,40,.09)}

.kpi .v{font-size:24px;font-weight:800;margin:2px 0}
.kpi .sub{font-size:11px;color:var(--muted)}
.qf{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;color:inherit}
.qf:hover{border-color:var(--acc);color:var(--acc)}
.qf.on{background:var(--acc);border-color:var(--acc);color:#fff}

table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--rowH);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}

</style>

<script>
/* ============================================================
   DDC CORE v5 — QC Document Control (An Hạ)
   4 họ layout:
     A "CHECK_LIST"  : 'Rev SPM' + 'FIR Report No.'
     B "PKL kết cấu" : 'RFI No-FUR'
     C "PKL ducting" : 'Report No. FIR-VIR' (100 cột, VIOLA_TED)
     D "BBNT nội địa": 'BBNT CK trước khi sử dụng' (SVĐ VINFAST)
   normRow dùng chung — map cột nào không có thì -1.
   ============================================================ */
(function(root){
'use strict';

function norm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();}
function isReal(v){
  if(v==null)return false; var s=String(v).trim();
  if(!s)return false;
  var u=s.toUpperCase().replace(/\s+/g,' ');
  if(u==='NOT APPLICABLE'||u==='N/A'||u==='NA'||u==='-'||u==='#N/A'||u==='FALSE'||u==='0'&&false)return false;
  var l=norm(s);
  if(l.indexOf('k mời')===0||l.indexOf('không mời')===0||l.indexOf('k moi')===0)return false;
  return true;
}
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate1(s,dmy){
  if(s==null)return null; s=String(s).trim(); if(!s)return null;
  var d=null,m=s.match(/^(\d{1,2})[\/\-]([A-Za-z]{3,})[\/\-,\s]*(\d{4})/);
  if(m){var mo=MON[m[2].slice(0,3).toLowerCase()];if(mo)d=new Date(+m[3],mo-1,+m[1]);}
  if(!d){m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
    if(m){var a=+m[1],b=+m[2],y=+m[3];
      if(a>12&&b<=12)d=new Date(y,b-1,a);
      else if(b>12&&a<=12)d=new Date(y,a-1,b);
      else d=dmy===false?new Date(y,a-1,b):new Date(y,b-1,a);}}
  if(!d){m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)d=new Date(+m[1],+m[2]-1,+m[3]);}
  if(d&&d.getFullYear()<1990)return null; /* 30/12/1899 = ô rỗng kiểu Excel */
  return d;
}
function lastDate(s,dmy){
  if(s==null)return null; var parts=String(s).split(/[,;\n]+/),best=null;
  for(var i=0;i<parts.length;i++){var d=parseDate1(parts[i],dmy);if(d&&(!best||d>best))best=d;}
  return best;
}
function lastTok(s){
  if(s==null)return ''; var p=String(s).split(/[,;\n]+/).map(function(x){return x.trim();}).filter(Boolean);
  return p.length?p[p.length-1]:'';
}
function allTok(s){if(s==null)return[];return String(s).split(/[,;\n]+/).map(function(x){return x.trim();}).filter(function(x){return x&&isReal(x);});}
function numOr(v,d){var s=String(v==null?'':v).trim();
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(/,/g,'.');}
  var n=parseFloat(s);return isNaN(n)?d:n;}
function ym(d){return d?d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2):null;}
function dstr(d){return d?('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear():'';}

function findHdr(rows,labels,maxRow){
  maxRow=Math.min(maxRow||8,rows.length);
  for(var r=0;r<maxRow;r++){var row=rows[r]||[];
    for(var c=0;c<row.length;c++){var v=norm(row[c]);if(!v)continue;
      for(var k=0;k<labels.length;k++){if(v.indexOf(labels[k])>=0)return {r:r,c:c};}
    }}
  return null;
}
function findExact(rows,label,maxRow,minC){
  maxRow=Math.min(maxRow||8,rows.length);minC=minC||0;
  for(var r=0;r<maxRow;r++){var row=rows[r]||[];
    for(var c=minC;c<row.length;c++){if(norm(row[c])===label)return c;}}
  return -1;
}

function detectLayout(rows){
  if(findHdr(rows,['rev spm'])&&findHdr(rows,['fir report no']))return 'A';
  if(findHdr(rows,['rfi no-fur']))return 'B';
  if(findHdr(rows,['report no. fir-vir','report no fir-vir']))return 'C';
  if(findHdr(rows,['bbnt ck trước khi sử dụng','bbnt ck truoc khi su dung']))return 'D';
  if(findHdr(rows,['member punch no']))return findHdr(rows,['date-dir+vir'])?'B':'A';
  return null;
}

function buildMap(rows,layout){
  function ix(lbls){var h=findHdr(rows,lbls);return h?h.c:-1;}
  var M={pn:-1,dwg:-1,ms:-1,ph:-1,grp1:-1,grp2:-1,w:-1,qty:-1,planD:-1,rev:-1,weld:-1,
    ws:-1,wsCut:-1,moiLai:-1,fitRfi:-1,fitD:-1,fitRev:-1,fitQc:-1,fitRep:-1,fitQA:-1,
    finRfi:-1,finD:-1,finRev:-1,finQc:-1,dir:-1,vir:-1,kiDDC:-1,kiKH:-1,bgHs:-1,
    rqNdt:-1,mt:-1,ut:-1,finChk:-1,zone:-1,code:null};
  if(layout==='A'){
    M.pn=ix(['member punch no']);M.dwg=ix(['tên bản vẽ']);M.ms=ix(['note5']);
    M.grp1=ix(['note6']);M.grp2=ix(['item']);
    M.w=ix(['weight [kg]']);M.qty=ix(['số lượng']);
    M.planD=ix(['after cutting plan date']);M.rev=ix(['rev spm']);
    M.ws=ix(['after cutting plan workshop']);M.weld=ix(['có hàn/không hàn']);
    M.moiLai=ix(['ghi chú tình trạng mời lại']);
    M.finRfi=ix(['rfi no']);M.finD=M.finRfi>=0?M.finRfi+1:-1;
    M.finRev=ix(['rev nthu']);M.finQc=ix(['checked qc']);
    M.fitRep=ix(['fir report no']);M.fitD=ix(['date fit']);
    M.dir=ix(['dir report no']);M.vir=ix(['vir report no']);
    M.kiDDC=ix(['trình kí ddc','trình ký ddc']);M.kiKH=ix(['trình kí khách hàng','trình ký khách hàng']);
    M.bgHs=ix(['tình trạng bàn giao hồ sơ']);
    M.rqNdt=ix(['rq ndt no']);M.mt=ix(['mt report no']);M.ut=ix(['ut report no']);
  }else if(layout==='B'){
    M.pn=ix(['member punch no']);M.dwg=ix(['drawing']);M.ms=ix(['note5']);
    M.ph=findExact(rows,'phase');M.grp1=ix(['note6']);M.grp2=ix(['note2']);M.zone=findExact(rows,'zone');
    M.w=ix(['weight [kg]']);M.rev=ix(['rev no']);
    M.wsCut=ix(['cutting assign workshop']);M.ws=ix(['fitup assign']);
    M.weld=findExact(rows,'note');
    M.fitD=ix(['date-fur']);M.fitRfi=ix(['rfi no-fur']);M.fitQc=ix(['qc check']);
    M.fitRep=ix(['report no-fur']);M.fitQA=ix(['bàn giao qa']);
    M.finChk=ix(['date-dir+vir']);M.finD=M.finChk;M.finRfi=ix(['rfi no-dir+vir']);
    M.planD=ix(['after cutting plan date']);
    (function(){var found=[],r,c,row;
      for(r=0;r<Math.min(8,rows.length);r++){row=rows[r]||[];for(c=0;c<row.length;c++){if(norm(row[c])==='rev qc')found.push(c);}}
      found.sort(function(a,b){return a-b;});
      M.fitRev=found.length?found[0]:-1;
      for(var k=0;k<found.length;k++){if(found[k]>M.finRfi){M.finRev=found[k];break;}}
      if(M.finRev<0&&found.length)M.finRev=found[found.length-1];
      M.finQc=findExact(rows,'qc check',8,M.finRfi>=0?M.finRfi+1:0);})();
  }else if(layout==='C'){
    M.pn=ix(['member no tên hồ sơ']);if(M.pn<0)M.pn=ix(['member no'])>=0?ix(['member no'])+4:-1;
    M.dwg=ix(['drawing']);M.ms=ix(['note5']);M.ph=findExact(rows,'phase');if(M.ph<0)M.ph=1;
    M.grp1=ix(['note6']);M.grp2=findExact(rows,'zone');if(M.grp2<0)M.grp2=0;
    var sec=ix(['section']);M.w=sec>=0?sec+2:-1;
    M.rev=M.dwg>=0?M.dwg+1:-1;
    M.wsCut=ix(['cutting assign workshop']);M.ws=ix(['after cutting plan workshop']);
    M.planD=M.ws>=1?M.ws-1:-1;
    /* cột Hàn/K Hàn: dò theo giá trị dữ liệu trong probe */
    (function(){for(var r=3;r<Math.min(10,rows.length);r++){var row=rows[r]||[];
      for(var c=0;c<row.length;c++){var v=norm(row[c]);if(v==='hàn'||v==='k hàn'){M.weld=c;return;}}}})();
    M.fitD=ix(['report no. fir-vir','report no fir-vir'])-1;
    M.fitRep=ix(['report no. fir-vir','report no fir-vir']);
    /* RFI chính = ô 'RFI No.' KHÔNG kèm trial/blas/pc/paint */
    (function(){for(var r=0;r<Math.min(8,rows.length);r++){var row=rows[r]||[];
      for(var c=0;c<row.length;c++){var v=norm(row[c]);
        if(v.indexOf('rfi no')===0&&v.indexOf('trial')<0&&v.indexOf('blas')<0&&v.indexOf(' pc')<0&&v.indexOf('paint')<0){M.finRfi=c;return;}}}})();
    M.finD=M.finRfi>=1?M.finRfi-1:-1;M.finRev=M.finRfi>=0?M.finRfi+1:-1;
    M.finQc=findExact(rows,'checked qc',8,M.finRfi>=0?M.finRfi+1:0);
    M.dir=ix(['report no. dir-vir','report no dir-vir']);
    M.mt=ix(['mt report no']);M.ut=ix(['ut report no']);
  }else if(layout==='D'){
    M.pn=ix(['tên cấu kiện']);M.dwg=ix(['mã cấu kiện']);
    M.grp1=ix(['mã hạng mục']);M.grp2=ix(['tên hạng mục']);
    var mat=ix(['material']);M.w=mat>=0?mat+1:-1;
    M.ws=ix(['nhà máy']);
    M.weld=ix(['ndt yes/no']);
    M.fitRep=ix(['bb hàn hoàn thiện']);
    M.finRfi=ix(['bbnt ck trước khi sử dụng','bbnt ck truoc']);
    M.finD=M.finRfi>=0?M.finRfi+1:-1;
    M.finQc=M.finRfi>=0?M.finRfi+2:-1;
    M.dir=M.finRfi;               /* BBNT = biên bản NT => coi như đã NT */
    M.kiDDC=ix(['chứng nhận xuất xưởng']);
    M.bgHs=ix(['biên bản giao nhận']);
    M.mt=findExact(rows,'mt');M.ut=findExact(rows,'ut');
    M._noFit=true;
  }
  var h=findHdr(rows,layout==='D'?['tên cấu kiện']:['member punch no','member no tên hồ sơ']);
  M._start=h?h.r+1:4;
  /* D: dòng ngay dưới header là dòng mẫu report -> bỏ qua khi pn trống, normRow tự lọc */
  return M;
}

function cell(row,i){return i>=0&&i<row.length?row[i]:null;}

function normRow(row,M,layout){
  var pn=cell(row,M.pn); if(!isReal(pn))return null;
  var weldRaw=norm(cell(row,M.weld));
  var welded;
  if(layout==='A')welded=weldRaw.indexOf('không')<0&&weldRaw.indexOf('hàn')>=0;
  else if(M.weld<0)welded=true;
  else welded=(weldRaw==='hàn'||weldRaw==='yes'||weldRaw==='có'||weldRaw==='co');
  var m={
    fitAppl:0,
    pn:String(pn).trim(),
    dwg:String(cell(row,M.dwg)||'').trim(),
    grp1:String(cell(row,M.grp1)||'').trim(),
    grp2:String(cell(row,M.grp2)||'').trim(),
    ms:String(cell(row,M.ms)||'').trim(),
    ph:String(cell(row,M.ph)||'').trim(),
    ws:String(cell(row,M.ws)||'').trim()||String(cell(row,M.wsCut)||'').trim(),
    wsCut:String(cell(row,M.wsCut)||'').trim(),
    w:numOr(cell(row,M.w),0),
    qty:numOr(cell(row,M.qty),1),
    weld:welded?1:0,
    rev:isReal(cell(row,M.rev))||String(cell(row,M.rev))==='0'?numOr(cell(row,M.rev),null):null,
    planD:lastDate(cell(row,M.planD),M._dmy)
  };
  /* FITUP */
  m.fitRfi=isReal(cell(row,M.fitRfi))?lastTok(cell(row,M.fitRfi)):'';
  m.fitD=lastDate(cell(row,M.fitD),M._dmy);
  m.fitRep=isReal(cell(row,M.fitRep))?lastTok(cell(row,M.fitRep)):'';
  m.fitRev=isReal(cell(row,M.fitRev))?numOr(cell(row,M.fitRev),null):null;
  m.fitQA=lastDate(cell(row,M.fitQA),M._dmy);
  m.fitInv=!!(m.fitRfi||m.fitD||m.fitRep);
  if(layout==='A')m.fitInv=!!m.fitRep;
  /* FINAL */
  m.finRfiAll=allTok(cell(row,M.finRfi));
  m.finRfi=m.finRfiAll.length?m.finRfiAll[m.finRfiAll.length-1]:'';
  m.finD=lastDate(cell(row,M.finD),M._dmy);
  m.finInv=!!(m.finRfi||m.finD);
  m.finRev=isReal(cell(row,M.finRev))||String(cell(row,M.finRev))==='0'?numOr(cell(row,M.finRev),null):null;
  m.finQc=isReal(cell(row,M.finQc))?String(cell(row,M.finQc)).trim():'';
  m.dir=isReal(cell(row,M.dir))?lastTok(cell(row,M.dir)):'';
  m.vir=isReal(cell(row,M.vir))?lastTok(cell(row,M.vir)):'';
  m.finDone=(M.dir>=0||M.vir>=0)?!!(m.dir||m.vir):null;
  /* hồ sơ + NDT */
  m.kiDDC=M.kiDDC>=0?isReal(cell(row,M.kiDDC)):null;
  m.kiKH=M.kiKH>=0?isReal(cell(row,M.kiKH)):null;
  m.bgHs=M.bgHs>=0?isReal(cell(row,M.bgHs)):null;
  m.ndt=(M.rqNdt>=0||M.mt>=0||M.ut>=0)?(isReal(cell(row,M.rqNdt))||isReal(cell(row,M.mt))||isReal(cell(row,M.ut))):null;
  m.moiLai=M.moiLai>=0?isReal(cell(row,M.moiLai)):(m.finRfiAll.length>1||/-R\d+$/i.test(m.finRfi));
  /* cảnh báo nâng rev */
  m.revWarnFin=(m.rev!=null&&m.finRev!=null&&m.finInv&&m.finRev<m.rev)?1:0;
  m.revWarnFit=(m.rev!=null&&m.fitRev!=null&&m.weld&&m.fitInv&&m.fitRev<m.rev)?1:0;
  m.revWarn=(m.revWarnFin||m.revWarnFit)?1:0;
  m.fitAppl=(M._noFit?0:m.weld);
  return m;
}

function mini(){return {n:0,t:0};}
function add(o,w){o.n++;o.t+=w;}
function aggregate(ma,rows,meta,pre){
  var layout=(pre&&pre.layout)||detectLayout(rows);
  if(!layout)return {ma:ma,err:'Layout chưa hỗ trợ — gửi mẫu sheet để khai báo thêm',meta:meta||{}};
  var M=(pre&&pre.M)||buildMap(rows,layout);
  if(pre&&pre.start!=null)M._start=pre.start;
  (function(){var ev_d=0,ev_m=0,cols=[M.planD,M.fitD,M.finD,M.fitQA],i,r,c,v,mm;
    for(r=M._start;r<Math.min(rows.length,M._start+3000);r++){var row=rows[r]||[];
      for(i=0;i<cols.length;i++){c=cols[i];if(c==null||c<0)continue;v=row[c];if(v==null)continue;
        var parts=String(v).split(/[,;\n]+/);
        for(var k=0;k<parts.length;k++){mm=parts[k].trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.]\d{4}/);
          if(mm){if(+mm[1]>12)ev_d++;else if(+mm[2]>12)ev_m++;}}}}
    M._dmy=ev_m>ev_d?false:true;})();
  var ms=[],i,r;
  for(i=M._start;i<rows.length;i++){r=normRow(rows[i],M,layout);if(r)ms.push(r);}
  var P={ma:ma,layout:layout,meta:meta||{},mem:ms.length,tan:0,qty:0,
    weld:mini(),khan:mini(),
    fitReq:mini(),fitInv:mini(),fitRep:mini(),fitQA:mini(),
    finInv:mini(),finDone:mini(),finNot:mini(),
    kiDDC:mini(),kiKH:mini(),bgHs:mini(),ndt:mini(),
    rev:mini(),moiLai:mini(),od:mini(),soon:mini(),vir:mini(),bgIssue:mini(),revCrit:mini(),
    byWs:{},byWsCut:{},byGrp:{},byDwg:{},byM:{},byMPlan:{},byMPlanNot:{},rfi:{},
    warnList:[],revBy:{none:0,fit:0,fin:0,ndt:0,bg:0},
    caps:{finDone:(M.dir>=0||M.vir>=0),hoso:(M.bgHs>=0||M.kiDDC>=0),ndt:(M.mt>=0||M.rqNdt>=0),fitQA:M.fitQA>=0}};
  for(i=0;i<Math.min(4,rows.length);i++){var row0=rows[i]||[];
    for(var c0=0;c0<row0.length;c0++){var v0=String(row0[c0]||'');var mm0=v0.match(/(\d{5}-\d{3})/);if(mm0){P.code=mm0[1];break;}}
    if(P.code)break;}
  var _today=new Date();_today.setHours(0,0,0,0);
  var _soonEnd=new Date(_today.getTime()+7*864e5);
  ms.forEach(function(m){
    var t=m.w/1000; P.tan+=t; P.qty+=m.qty;
    var _od=(m.planD&&m.planD<_today&&!m.finInv);if(_od)add(P.od,t);
    var _soon=(m.planD&&m.planD>=_today&&m.planD<=_soonEnd&&!m.finInv);if(_soon)add(P.soon,t);
    add(m.weld?P.weld:P.khan,t);
    if(m.fitAppl){add(P.fitReq,t);if(m.fitInv)add(P.fitInv,t);if(m.fitRep)add(P.fitRep,t);if(m.fitQA)add(P.fitQA,t);}
    if(m.finInv)add(P.finInv,t);else add(P.finNot,t);
    if(m.finDone)add(P.finDone,t);
    if(m.kiDDC)add(P.kiDDC,t);if(m.kiKH)add(P.kiKH,t);if(m.bgHs)add(P.bgHs,t);if(m.ndt)add(P.ndt,t);
    if(m.vir)add(P.vir,t);
    if(m.bgHs&&P.caps.ndt&&!m.ndt)add(P.bgIssue,t);
    if(m.revWarn){add(P.rev,t);if(P.warnList.length<400)P.warnList.push([m.pn,m.dwg,m.rev,(m.revWarnFin?m.finRev:m.fitRev),(m.revWarnFin?'FINAL':'FITUP'),m.finRfi||m.fitRfi,m.ws]);
      if(m.bgHs){P.revBy.bg++;add(P.revCrit,t);}else if(m.ndt)P.revBy.ndt++;else if(m.finDone||m.finInv)P.revBy.fin++;else if(m.fitRep||m.fitInv)P.revBy.fit++;else P.revBy.none++;}
    if(m.moiLai)add(P.moiLai,t);
    function wsAdd(map,key){var W=map[key]||(map[key]={mem:0,tan:0,han:0,fitReq:0,fitReqT:0,fitInv:0,fitInvT:0,fitRep:0,fitQA:0,finInv:0,finInvT:0,finDone:0,finDoneT:0,kiDDC:0,bgHs:0,rev:0,od:0,odT:0});
      W.mem++;W.tan+=t;if(m.weld)W.han++;
      if(m.fitAppl){W.fitReq++;W.fitReqT+=t;if(m.fitInv){W.fitInv++;W.fitInvT+=t;}if(m.fitRep)W.fitRep++;if(m.fitQA)W.fitQA++;}
      if(m.finInv){W.finInv++;W.finInvT+=t;}
      if(m.finDone){W.finDone++;W.finDoneT+=t;}
      if(m.kiDDC)W.kiDDC++;if(m.bgHs)W.bgHs++;if(m.revWarn)W.rev++;
      if(_od){W.od++;W.odT+=t;}
      if(_soon)W.soon=(W.soon||0)+1;}
    var ws=m.ws||'?';wsAdd(P.byWs,ws);
    if(m.wsCut)wsAdd(P.byWsCut,m.wsCut);
    var gk=[(m.ms||'?'),(m.grp1||'?'),(m.grp2||'?'),(m.ph||'')].join('‖');
    var G=P.byGrp[gk]||(P.byGrp[gk]={mem:0,tan:0,han:0,fitReq:0,fitInv:0,fitRep:0,finInv:0,finInvT:0,finDone:0,bgHs:0,ndt:0,rev:0,od:0});
    G.mem++;G.tan+=t;if(m.weld)G.han++;if(m.fitAppl){G.fitReq++;if(m.fitInv)G.fitInv++;if(m.fitRep)G.fitRep++;}
    if(m.ndt)G.ndt++;
    if(m.finInv){G.finInv++;G.finInvT+=t;}if(m.finDone)G.finDone++;if(m.bgHs)G.bgHs++;if(m.revWarn)G.rev++;if(_od)G.od++;if(_soon)G.soon=(G.soon||0)+1;
    var dk=m.dwg||'?';
    var Dg=P.byDwg[dk]||(P.byDwg[dk]={grp:m.grp1||m.grp2||'',mem:0,tan:0,fitInv:0,finInv:0,finDone:0,bgHs:0,rev:0,d:null,wsc:{},fitReq:0,od:0,han:0});
    Dg.wsc[ws]=(Dg.wsc[ws]||0)+1;Dg.mem++;Dg.tan+=t;if(m.weld)Dg.han++;if(m.fitAppl)Dg.fitReq++;if(m.fitInv)Dg.fitInv++;if(m.finInv)Dg.finInv++;if(m.finDone)Dg.finDone++;if(m.bgHs)Dg.bgHs++;if(m.revWarn)Dg.rev++;if(_od)Dg.od++;if(_soon)Dg.soon=(Dg.soon||0)+1;
    if(m.finD&&(!Dg.d||m.finD>Dg.d))Dg.d=m.finD;
    var mo=ym(m.finD);if(mo){var B=P.byM[mo]||(P.byM[mo]={inv:0,invT:0,done:0,doneT:0});B.inv++;B.invT+=t;if(m.finDone){B.done++;B.doneT+=t;}}
    var pmo=ym(m.planD);if(pmo){var BP=P.byMPlan[pmo]||(P.byMPlan[pmo]={n:0,t:0});BP.n++;BP.t+=t;
      if(!m.finInv){var BN=P.byMPlanNot[pmo]||(P.byMPlanNot[pmo]={n:0,t:0});BN.n++;BN.t+=t;}}
    m.finRfiAll.forEach(function(rf){var R=P.rfi[rf]||(P.rfi[rf]={type:'FINAL',n:0,t:0,d:null,qc:m.finQc||''});R.n++;R.t+=t;if(m.finD&&(!R.d||m.finD>R.d))R.d=m.finD;});
    if(m.fitRfi){var R2=P.rfi[m.fitRfi]||(P.rfi[m.fitRfi]={type:'FITUP',n:0,t:0,d:null,qc:''});R2.n++;R2.t+=t;if(m.fitD&&(!R2.d||m.fitD>R2.d))R2.d=m.fitD;}
  });
  var dwgArr=Object.keys(P.byDwg).map(function(k){var d=P.byDwg[k];
    var wsBest='',wsN=0,wk;for(wk in d.wsc){if(d.wsc[wk]>wsN){wsN=d.wsc[wk];wsBest=wk;}}
    return [k,d.grp,d.mem,+d.tan.toFixed(2),d.fitInv,d.finInv,d.finDone,d.bgHs,d.rev,dstr(d.d),wsBest,d.fitReq,d.od,d.han,d.soon||0];});
  dwgArr.sort(function(a,b){return b[8]-a[8]||b[3]-a[3];});
  P.dwg=dwgArr.length; P.byDwg=dwgArr.slice(0,800);
  var rfiArr=Object.keys(P.rfi).map(function(k){var r=P.rfi[k];return [k,r.type,r.n,+r.t.toFixed(2),dstr(r.d),r.qc];});
  rfiArr.sort(function(a,b){return (b[4]||'').split('/').reverse().join('')<(a[4]||'').split('/').reverse().join('')?-1:1;});
  P.rfi=rfiArr;
  P.tan=+P.tan.toFixed(2);
  Object.keys(P.byGrp).forEach(function(k){var g=P.byGrp[k];g.tan=+g.tan.toFixed(2);g.finInvT=+g.finInvT.toFixed(2);});
  [P.byWs,P.byWsCut].forEach(function(mp){Object.keys(mp).forEach(function(k){var w=mp[k];['tan','fitReqT','fitInvT','finInvT','finDoneT','odT'].forEach(function(f){w[f]=+(w[f]||0).toFixed(2);});});});
  ['weld','khan','fitReq','fitInv','fitRep','fitQA','finInv','finDone','finNot','kiDDC','kiKH','bgHs','ndt','rev','moiLai','od','soon','vir','bgIssue','revCrit'].forEach(function(k){P[k].t=+P[k].t.toFixed(2);});
  return P;
}

var API={norm:norm,isReal:isReal,parseDate1:parseDate1,lastDate:lastDate,detectLayout:detectLayout,buildMap:buildMap,normRow:normRow,aggregate:aggregate,ym:ym,dstr:dstr};

/* ---------- tải dữ liệu dự án ---------- */
function _dcLoadProject(rg,force){
  var ck='ddcA1_'+rg.sid;
  if(!force){try{var c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&c.upd===rg.upd&&c.P&&c.P.sel&&c.P.byGrp){var k1=Object.keys(c.P.byGrp)[0];if(!k1||k1.split('‖').length>=4){c.P.meta=c.P.meta||{};c.P.meta.cached=true;c.P.meta.sid=rg.sid;return Promise.resolve(c.P);}}}catch(e){}}
  var tab='CHECK_LIST',probeCode=null;
  return _dcFetch(_dcUrl(rg.sid,'sheet='+encodeURIComponent('DOI CHIEU')+'&tq='+encodeURIComponent('limit 5')))
  .then(function(dc){for(var i=0;i<dc.length;i++){var v=String(dc[i][0]||'').trim();if(v&&!/tab du lieu/i.test(v)){tab=v;break;}}},function(){})
  .then(function(){_dcSt('Đang tải '+rg.ma+' ('+tab+')…');
    return _dcFetch(_dcUrl(rg.sid,'sheet='+encodeURIComponent(tab)+'&tq='+encodeURIComponent('limit 8')));})
  .then(function(probe){
    var layout=DDC_CORE.detectLayout(probe);
    if(!layout)throw new Error('layout chưa hỗ trợ');
    for(var i=0;i<Math.min(4,probe.length)&&!probeCode;i++){for(var c=0;c<(probe[i]||[]).length;c++){var mm=String(probe[i][c]||'').match(/(\d{5}-\d{3})/);if(mm){probeCode=mm[1];break;}}}
    var M=DDC_CORE.buildMap(probe,layout);
    var keys=[],k;for(k in M){if(k.charAt(0)!=='_'&&M[k]>=0)keys.push(k);}
    var idxs=[];keys.forEach(function(kk){if(idxs.indexOf(M[kk])<0)idxs.push(M[kk]);});idxs.sort(function(a,b){return a-b;});
    var letters=idxs.map(_dcColL),pnL=_dcColL(M.pn),dwgL=M.dwg>=0?_dcColL(M.dwg):pnL;
    var q='select '+letters.join(',')+' where '+pnL+' is not null';
    return _dcFetch(_dcUrl(rg.sid,'sheet='+encodeURIComponent(tab)+'&tq='+encodeURIComponent(q))).then(function(rows){
      var pos={},M2={};idxs.forEach(function(v,i){pos[v]=i;});
      for(k in M){if(k.charAt(0)==='_')continue;M2[k]=(M[k]>=0&&pos[M[k]]!=null)?pos[M[k]]:-1;}
      var start=0;outer:for(var r=0;r<Math.min(12,rows.length);r++){var row=rows[r]||[];for(var c2=0;c2<row.length;c2++){if(/member punch no/i.test(String(row[c2]||''))){start=r+1;break outer;}}}
      var P=DDC_CORE.aggregate(rg.ma,rows,{upd:rg.upd,live:true,sid:rg.sid},{layout:layout,M:M2,start:start});
      if(!P.code&&probeCode)P.code=probeCode;
      P.sel={letters:letters.join(','),pnL:pnL,dwgL:dwgL,tab:tab,map:M2};
      P.meta.sid=rg.sid;
      try{localStorage.setItem(ck,JSON.stringify({upd:rg.upd,P:P}));}
      catch(e){try{var P2=JSON.parse(JSON.stringify(P));P2.byDwg=(P2.byDwg||[]).slice(0,300);P2.warnList=(P2.warnList||[]).slice(0,200);P2.rfi=(P2.rfi||[]).slice(0,200);localStorage.setItem(ck,JSON.stringify({upd:rg.upd,P:P2}));}catch(e2){}}
      return P;
    });
  });
}
function _dcLoad(force){
  if(_dcBusy)return;_dcBusy=true;
  _dcSt('Đang đọc danh mục dự án…');
  _dcFetch(_dcUrl(DDC_REG.id,'sheet='+encodeURIComponent('DANH MUC')))
  .then(null,function(){return _dcFetch(_dcUrl(DDC_REG.id,'gid='+DDC_REG.gid));})
  .then(function(reg){
    var hdr=(reg[0]||[]).map(function(x){return DDC_CORE.norm(x);});
    function fi(s2){for(var i=0;i<hdr.length;i++)if(hdr[i].indexOf(s2)>=0)return i;return -1;}
    var iMa=fi('ma du an'),iId=fi('spreadsheet id'),iUp=fi('cap nhat cuoi'),iSpm=fi('spm');
    var regs=[];reg.slice(1).forEach(function(r){var sid=String(r[iId]||'').trim();if(sid.length>20)regs.push({ma:String(r[iMa]||sid).trim(),sid:sid,upd:String(r[iUp]||'').trim(),spm:iSpm>=0?String(r[iSpm]||'').trim():''});});
    var ps=[],chain=Promise.resolve(),total=regs.length,done=0;
    function tick(){done++;_dcSt('Đã tải '+done+'/'+total+' dự án…');
      DDC={built:new Date().toLocaleString('vi-VN'),src:'Google Sheet (trực tiếp) — đang tải '+done+'/'+total,projects:ps.slice()};
      try{_dcRender();}catch(e){}}
    regs.forEach(function(rg){chain=chain.then(function(){
      return _dcLoadProject(rg,force).then(function(P){if(rg.spm){P.meta.spm=rg.spm;}ps.push(P);tick();},function(e){
        var sd=null;if(window.DDC_SEED&&DDC_SEED.projects)DDC_SEED.projects.forEach(function(p){if(p.ma===rg.ma)sd=p;});
        if(sd){sd.meta=sd.meta||{};sd.meta.stale=true;sd.meta.err=String(e&&e.message||e);sd.meta.sid=rg.sid;ps.push(sd);}
        else ps.push({ma:rg.ma,err:String(e&&e.message||e),meta:{upd:rg.upd,sid:rg.sid}});
        tick();
      });});});
    return chain.then(function(){DDC={built:new Date().toLocaleString('vi-VN'),src:'Google Sheet (trực tiếp)',projects:ps};});
  }).then(function(){_dcBusy=false;_dcSt('');_dcRender();},function(e){
    _dcBusy=false;
    if(!DDC)DDC=window.DDC_SEED||{projects:[],src:'—'};
    _dcSt('Không đọc trực tiếp được ('+String(e&&e.message||e)+') — đang dùng bản lưu.');
    _dcRender();
  });
}

/* ---------- xuất Excel ---------- */
var _dcXlsData={};
function _dcXls(key,name){
  var d=_dcXlsData[key];if(!d||typeof XLSX==='undefined'){alert('Chưa có dữ liệu hoặc thiếu thư viện XLSX (cần internet).');return;}
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),(name||key).slice(0,28));
  XLSX.writeFile(wb,'DDC_'+(name||key)+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function _dcXlsBtn(key,name){return '<button class="qf" style="float:right" onclick="_dcXls(\''+key+'\',\''+name+'\')">⬇ Excel</button>';}

/* ---------- tổng hợp ---------- */
function _dcTot(){var T={mem:0,tan:0,han:0,hanT:0,khan:0,khanT:0,ndt:0,fitReq:0,fitReqT:0,fitInv:0,fitInvT:0,finInv:0,finInvT:0,finNot:0,finNotT:0,finDone:0,finDoneT:0,bg:0,rev:0,revT:0,moiLai:0,od:0,odT:0,capHs:false};
  (DDC.projects||[]).forEach(function(P){if(P.err)return;
    T.mem+=P.mem;T.tan+=P.tan;T.han+=P.weld.n;T.hanT+=P.weld.t;T.khan+=P.khan.n;T.khanT+=P.khan.t;if(P.ndt)T.ndt+=P.ndt.n;T.fitReq+=P.fitReq.n;T.fitReqT+=P.fitReq.t;T.fitInv+=P.fitInv.n;T.fitInvT+=P.fitInv.t;
    T.finInv+=P.finInv.n;T.finInvT+=P.finInv.t;T.finNot+=P.finNot.n;T.finNotT+=P.finNot.t;
    if(P.caps&&P.caps.finDone){T.finDone+=P.finDone.n;T.finDoneT+=P.finDone.t;}
    if(P.caps&&P.caps.hoso){T.bg+=P.bgHs.n;T.capHs=true;}
    if(P.od){T.od+=P.od.n;T.odT+=P.od.t;}
    T.rev+=P.rev.n;T.revT+=P.rev.t;T.moiLai+=P.moiLai.n;});
  return T;}
function _dcWsAll(){var A={};
  (DDC.projects||[]).forEach(function(P){if(P.err)return;
    var src=(_dcWsDim==='cut'&&P.byWsCut&&Object.keys(P.byWsCut).length)?P.byWsCut:P.byWs;
    Object.keys(src||{}).forEach(function(x){var w=src[x];
      var a=A[x]||(A[x]={mem:0,tan:0,han:0,fitReq:0,fitInv:0,finInv:0,finInvT:0,finDone:0,od:0,odT:0,pjs:[]});
      a.mem+=w.mem;a.tan+=w.tan;a.han+=(w.han||0);a.fitReq+=(w.fitReq||0);a.fitInv+=w.fitInv;
      a.finInv+=w.finInv;a.finInvT+=(w.finInvT||0);a.finDone+=w.finDone;a.od+=(w.od||0);a.odT+=(w.odT||0);
      a.pjs.push(_dcSpmName(P).full?_dcSpmName(P).short.slice(0,20):P.ma);});});
  return A;}
function _dcWsDimSet(d2){_dcWsDim=d2;_dcRender();}
function _dcDims(P){var d={ms:0,kv:0,hm:0,ph:0};
  Object.keys(P.byGrp||{}).forEach(function(k){var p=k.split('‖');
    if(p[0]&&p[0]!=='?')d.ms++;if(p[1]&&p[1]!=='?')d.kv++;if(p[2]&&p[2]!=='?')d.hm++;if(p[3])d.ph++;});
  return d;}
function _dcSelP(i){_dcSel=(_dcSel===i?-1:i);_dcPane='tq';_dcWsF='';_dcQ='';_dcMemRows=null;_dcMemDesc='';_dcRender();
  var el=document.getElementById('dcDetail');if(el&&_dcSel>=0)el.scrollIntoView({behavior:'smooth'});}
function _dcSetPane(p){_dcPane=p;_dcRender();}
function _dcWsFilter(ws){_dcWsF=(_dcWsF===ws?'':ws);_dcPane='dwg';_dcRender();}
function _dcSearch(v){_dcQ=String(v||'').trim().toUpperCase();var P=(DDC.projects||[])[_dcSel];var pane=document.getElementById('dcPane');if(P&&pane&&_dcPane==='dwg'){pane.innerHTML=_dcPaneDwg(P);var inp=document.getElementById('dcQ');if(inp){inp.focus();inp.value=_dcQ;inp.setSelectionRange(_dcQ.length,_dcQ.length);}}}

/* ---------- render chính ---------- */
function _dcRender(){
  if(!DDC){DDC=window.DDC_SEED||{projects:[],src:'—',built:''};}
  var src=document.getElementById('dcSrc');
  if(src){var lbl=(DDC.src||'—')+(DDC.built?' · tổng hợp lúc '+DDC.built:'');
    var stale=[];(DDC.projects||[]).forEach(function(P){if(P.meta&&P.meta.stale)stale.push(P.ma);});
    if(stale.length)lbl+=' · <b style="color:var(--warn)">'+stale.join(', ')+': dùng bản lưu</b>';
    src.innerHTML=lbl;}
  var T=_dcTot();
  var K=document.getElementById('dcKpis');
  if(K)K.innerHTML=
    kpi('',_dcN(T.mem),'Tổng cấu kiện (cây)','Hàn '+_dcN(T.han)+' · K.hàn '+_dcN(T.khan)+' · '+fm1(T.tan)+' t · '+_dcN((DDC.projects||[]).filter(function(p){return !p.err;}).length)+' dự án')+
    kpi('',_dcN(T.fitInv)+' / '+_dcN(T.fitReq),'FITUP (cây hàn) — đã mời / cần','CHƯA mời fitup '+_dcN(T.fitReq-T.fitInv)+' cây · '+fm1(T.fitReqT-T.fitInvT)+' t')+
    kpi('',_dcN(T.finInv),'FINAL (DIM+VISUAL) — đã mời',fm1(T.finInvT)+' t · '+_dcPc(T.finInv,T.mem)+'% số cây')+
    kpi(T.finNot?'warn':'',_dcN(T.finNot),'CHƯA mời FINAL',fm1(T.finNotT)+' t (gồm cả hàn & k.hàn) — bấm xem','_dcScrollWs()')+
    kpi(T.od?'warn':'',_dcN(T.od),'Quá hạn KH cắt — chưa mời',fm1(T.odT)+' t đã qua ngày kế hoạch cắt','_dcScrollWs()')+
    kpi('',T.finDone?_dcN(T.finDone):'—','Đã NT final (DIR/VIR)',T.finDone?fm1(T.finDoneT)+' t · NDT '+_dcN(T.ndt)+' cây':'dự án có theo dõi report')+
    kpi('',T.capHs?_dcN(T.bg):'—','Bàn giao hồ sơ',T.capHs?'trình kí DDC + KH':'chưa theo dõi')+
    kpi(T.rev?'bad':'',_dcN(T.rev),'Cảnh báo nâng rev',T.rev?fm1(T.revT)+' t phải mời lại — bấm xem':'không có',T.rev?'_dcJumpRev()':'');
  var RC=document.getElementById('dcRevCard');
  if(RC){if(T.rev||T.moiLai){RC.style.display='';RC.innerHTML='<b style="color:var(--bad)">⚠ Cảnh báo rev & mời lại:</b> '+
    _dcN(T.rev)+' cấu kiện đã mời/nghiệm thu ở rev cũ, bản vẽ đã nâng rev ('+fm1(T.revT)+' t) · '+
    _dcN(T.moiLai)+' cấu kiện <b>mời lại</b> (RFI -R2/-R3 hoặc nhiều đợt).';}
   else RC.style.display='none';}
  var sel=document.getElementById('dcProjSel');
  if(sel){var opts='<option value="-1">— Xem nhanh 1 dự án —</option>';
    (DDC.projects||[]).forEach(function(P,i){var nm=P.err?P.ma:_dcSpmName(P).disp;opts+='<option value="'+i+'"'+(i===_dcSel?' selected':'')+'>'+_dcEsc(nm)+(P.err?' (lỗi)':'')+'</option>';});
    if(sel.innerHTML!==opts)sel.innerHTML=opts;sel.value=String(_dcSel);}
  _dcWsCard();_dcChartPipe();_dcChartMonth();_dcTable();_dcDetail();
}
function _dcProjSel(v){var i=parseInt(v,10);if(isNaN(i))i=-1;_dcSel=i;_dcPane='tq';_dcWsF='';_dcQ='';_dcMemRows=null;_dcRender();
  if(i>=0){var el=document.getElementById('dcDetail');if(el)el.scrollIntoView({behavior:'smooth'});}}
function _dcScrollWs(){var el=document.getElementById('dcWsCard');if(el)el.scrollIntoView({behavior:'smooth'});}
function _dcJumpRev(){for(var i=0;i<(DDC.projects||[]).length;i++){var P=DDC.projects[i];if(!P.err&&P.rev.n){_dcSel=i;_dcPane='rev';_dcRender();var el=document.getElementById('dcDetail');if(el)el.scrollIntoView({behavior:'smooth'});return;}}}

/* ---------- card XƯỞNG ---------- */
function _dcWsCard(){
  var el=document.getElementById('dcWsTbl');if(!el)return;
  var A=_dcWsAll();
  var ks=Object.keys(A).sort(function(a,b){return A[b].tan-A[a].tan;});
  var inv=[],od=[],rem=[];
  ks.forEach(function(x){var a=A[x];
    inv.push(+a.finInvT.toFixed(1));
    var remT=Math.max(a.tan-a.finInvT,0);
    var odT=Math.min(a.odT,remT);
    od.push(+odT.toFixed(1));rem.push(+(remT-odT).toFixed(1));});
  setOpt('cDcWs',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return fm1(v)+' t';}},
    legend:{top:0},grid:{left:8,right:34,top:26,bottom:8,containLabel:true},
    xAxis:{type:'value',name:'tấn'},yAxis:{type:'category',data:ks,axisLabel:{fontWeight:800}},
    series:[
      {name:'Đã mời NT',type:'bar',stack:'s',barMaxWidth:20,itemStyle:{color:grad('#22C55E','#15803D')},data:inv},
      {name:'Quá hạn KH cắt — chưa mời',type:'bar',stack:'s',itemStyle:{color:grad('#F87171','#DC2626')},data:od},
      {name:'Chưa mời (trong hạn)',type:'bar',stack:'s',itemStyle:{color:document.documentElement.dataset.theme==='dark'?'#4a3d2a':'#FED7AA'},
       label:{show:true,position:'right',fontWeight:800,formatter:function(p2){var a=A[ks[p2.dataIndex]];return _dcPc(a.finInvT,a.tan)+'%';}},data:rem}]});
  var aoa=[['Xưởng','Cây','Hàn','Tấn','Fitup đã mời','Fitup cần','Chưa mời fitup','Final mời (cây)','Final mời (t)','Chưa mời final (cây)','Chưa mời final (t)','Quá hạn (cây)','Quá hạn (t)','% mời (t)','Dự án']];
  var h='<thead><tr><th>Xưởng <button class="qf'+(_dcWsDim==='fit'?' on':'')+'" onclick="_dcWsDimSet(\'fit\')" title="Xưởng phân công fitup">fitup</button><button class="qf'+(_dcWsDim==='cut'?' on':'')+'" onclick="_dcWsDimSet(\'cut\')" title="Xưởng phân công cắt">cắt</button></th><th class="n">Cây</th><th class="n">Hàn</th><th class="n">Tấn</th><th class="n">FITUP mời/cần</th><th class="n">Chưa mời fitup</th><th class="n">FINAL đã mời</th><th class="n">CHƯA mời final</th><th class="n">Quá hạn KH cắt</th><th style="min-width:110px">% mời (tấn)</th><th>Dự án</th></tr></thead><tbody>';
  ks.forEach(function(x){var a=A[x];
    var remN=a.mem-a.finInv,remT=Math.max(a.tan-a.finInvT,0),pc=_dcPc(a.finInvT,a.tan),fitRem=a.fitReq-a.fitInv;
    var pjs=[];a.pjs.forEach(function(p2){if(pjs.indexOf(p2)<0)pjs.push(p2);});
    h+='<tr><td><b>'+_dcEsc(x)+'</b></td><td class="n">'+_dcN(a.mem)+'</td><td class="n">'+_dcN(a.han)+'</td><td class="n"><b>'+fm1(a.tan)+'</b></td>'+
      '<td class="n">'+_dcN(a.fitInv)+' / '+_dcN(a.fitReq)+'</td>'+
      '<td class="n">'+(fitRem?'<b style="color:var(--warn)">'+_dcN(fitRem)+'</b>':'0')+'</td>'+
      '<td class="n" style="color:var(--good)"><b>'+_dcN(a.finInv)+'</b> <span class="muted">('+fm1(a.finInvT)+' t)</span></td>'+
      '<td class="n" style="color:var(--warn)"><b>'+_dcN(remN)+'</b> <span class="muted">('+fm1(remT)+' t)</span></td>'+
      '<td class="n">'+(a.od?'<b style="color:var(--bad)">'+_dcN(a.od)+'</b> <span class="muted">('+fm1(a.odT)+' t)</span>':'0')+'</td>'+
      '<td>'+_dcBar(pc)+'</td><td class="muted" style="font-size:11px">'+_dcEsc(pjs.join(', '))+'</td></tr>';
    aoa.push([x,a.mem,a.han,+a.tan.toFixed(2),a.fitInv,a.fitReq,fitRem,a.finInv,+a.finInvT.toFixed(2),remN,+remT.toFixed(2),a.od,+a.odT.toFixed(2),pc,pjs.join(', ')]);});
  el.innerHTML=h+'</tbody>';
  _dcXlsData.wsall=aoa;
}
function _dcChartPipe(){
  var ps=(DDC.projects||[]).filter(function(p){return !p.err;});
  var names=ps.map(function(p){var nm=_dcSpmName(p);return nm.full?nm.short.slice(0,26):p.ma;});
  var done=ps.map(function(p){return p.caps.finDone?+(p.finDone.t).toFixed(1):0;});
  var inv=ps.map(function(p){return +(p.finInv.t-(p.caps.finDone?p.finDone.t:0)).toFixed(1);});
  var not=ps.map(function(p){return +(p.finNot.t).toFixed(1);});
  setOpt('cDcPipe',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return fm1(v)+' t';}},
    legend:{top:0},grid:{left:8,right:30,top:26,bottom:8,containLabel:true},
    xAxis:{type:'value',name:'tấn'},yAxis:{type:'category',data:names,axisLabel:{fontWeight:700}},
    series:[
     {name:'Đã nghiệm thu',type:'bar',stack:'s',barMaxWidth:22,itemStyle:{color:grad('#22C55E','#15803D')},data:done},
     {name:'Đã mời — chờ NT',type:'bar',stack:'s',itemStyle:{color:grad('#60A5FA','#2563EB')},data:inv},
     {name:'Chưa mời',type:'bar',stack:'s',itemStyle:{color:document.documentElement.dataset.theme==='dark'?'#4a3d2a':'#FED7AA'},
      label:{show:true,position:'right',fontWeight:800,formatter:function(p2){var P=ps[p2.dataIndex];return _dcPc(P.finInv.n,P.mem)+'% mời';}},data:not}]
  },function(p2){_dcSelP((DDC.projects||[]).indexOf(ps[p2.dataIndex]));});
}
function _dcChartMonth(){
  var inv={},plan={},planNot={};
  (DDC.projects||[]).forEach(function(P){if(P.err)return;var m;
    for(m in (P.byM||{}))inv[m]=(inv[m]||0)+P.byM[m].invT;
    for(m in (P.byMPlan||{}))plan[m]=(plan[m]||0)+P.byMPlan[m].t;
    for(m in (P.byMPlanNot||{}))planNot[m]=(planNot[m]||0)+P.byMPlanNot[m].t;});
  var ms={};var k;for(k in inv)ms[k]=1;for(k in plan)ms[k]=1;

    grid:{left:8,right:14,top:26,bottom:8,containLabel:true},
    xAxis:{type:'category',data:mos.map(function(m2){return m2.slice(5)+'/'+m2.slice(2,4);})},
    yAxis:{type:'value',name:'tấn'},
    series:[{name:'Đã mời NT (tấn)',type:'bar',barMaxWidth:24,itemStyle:{color:grad('#60A5FA','#2563EB'),borderRadius:[3,3,0,0]},data:mos.map(function(m2){return +(inv[m2]||0).toFixed(1);})},
            {name:'KH cắt còn tồn chưa mời',type:'bar',barMaxWidth:24,itemStyle:{color:grad('#F87171','#DC2626'),borderRadius:[3,3,0,0]},data:mos.map(function(m2){return +(planNot[m2]||0).toFixed(1);})},
            {name:'Kế hoạch cắt SPM (tấn)',type:'line',smooth:true,symbolSize:7,lineStyle:{width:3,color:'#D97706'},itemStyle:{color:'#D97706'},data:mos.map(function(m2){return +(plan[m2]||0).toFixed(1);})}]});
}
function _dcTable(){
  var el=document.getElementById('tDcProj');if(!el)return;
  var h='<thead><tr><th>Dự án</th><th>Mã SPM</th><th>Cập nhật sheet</th><th class="n">Cây</th><th class="n">Tấn</th><th class="n">Fitup mời/cần</th><th class="n">Final đã mời</th><th class="n">Còn lại</th><th class="n">Quá hạn</th><th class="n">Đã NT</th><th class="n">BG hồ sơ</th><th class="n">Rev ⚠</th><th class="n">Mời lại</th></tr></thead><tbody>';
  (DDC.projects||[]).forEach(function(P,i){
    if(P.err){h+='<tr><td><b>'+_dcEsc(P.ma)+'</b></td><td colspan="12" style="color:var(--bad)">'+_dcEsc(P.err)+'</td></tr>';return;}
    var nm=_dcSpmName(P);
    h+='<tr class="clickable" style="'+(i===_dcSel?'background:var(--rowH)':'')+'" onclick="_dcSelP('+i+')">'+
      '<td><b>'+_dcEsc(nm.full?nm.short:P.ma)+'</b><br><span class="muted" style="font-size:10.5px">'+_dcEsc(nm.full?('file: '+P.ma+' · '+nm.code):'chưa khớp SPM — chọn ở thẻ So sánh')+'</span>'+(P.meta&&P.meta.stale?' <span class="tag o">bản lưu</span>':'')+(P.meta&&P.meta.cached?' <span class="tag">cache</span>':'')+'</td>'+
      '<td>'+_dcEsc(nm.code||'—')+'</td><td style="white-space:nowrap">'+_dcEsc(P.meta&&P.meta.upd||'')+'</td>'+
      '<td class="n"><b>'+_dcN(P.mem)+'</b></td><td class="n"><b>'+fm1(P.tan)+'</b></td>'+
      '<td class="n">'+_dcN(P.fitInv.n)+' / '+_dcN(P.fitReq.n)+'</td>'+
      '<td class="n" style="color:var(--good)">'+_dcN(P.finInv.n)+' <span class="muted">('+_dcPc(P.finInv.n,P.mem)+'%)</span></td>'+
      '<td class="n" style="color:var(--warn)"><b>'+_dcN(P.finNot.n)+'</b> <span class="muted">('+fm1(P.finNot.t)+' t)</span></td>'+
      '<td class="n">'+(P.od&&P.od.n?'<b style="color:var(--bad)">'+_dcN(P.od.n)+'</b>':'0')+'</td>'+
      '<td class="n">'+(P.caps.finDone?_dcN(P.finDone.n):'—')+'</td>'+
      '<td class="n">'+(P.caps.hoso?_dcN(P.bgHs.n):(P.caps.fitQA?_dcN(P.fitQA.n)+' <span class="muted">QA fitup</span>':'—'))+'</td>'+
      '<td class="n">'+(P.rev.n?'<b style="color:var(--bad)">'+_dcN(P.rev.n)+'</b>':'0')+'</td>'+
      '<td class="n">'+(P.moiLai.n?'<b style="color:var(--warn)">'+_dcN(P.moiLai.n)+'</b>':'0')+'</td></tr>';
  });
  el.innerHTML=h+'</tbody>';
}

/* ================= CHI TIẾT DỰ ÁN ================= */
function _dcDetail(){
  var el=document.getElementById('dcDetail');if(!el)return;
  var P=(DDC.projects||[])[_dcSel];
  if(!P||P.err){el.style.display='none';return;}
  el.style.display='';
  var tabs=[['tq','Tổng quan'],['todo','🔔 Cần mời NT'],['hs','📁 Việc hồ sơ'],['grp','Hạng mục · Milestone'],['ws','Xưởng'],['rfi','Thư mời RFI'],['dwg','Bản vẽ'],['mem','Tra cứu cấu kiện'],['rev','Cảnh báo rev'],['spm','So sánh SPM · KHSX']];
  var _nm=_dcSpmName(P);
  var h='<h3>Dự án '+_dcEsc(_nm.disp)+(_nm.full?' <span class="muted" style="font-weight:400;font-size:12px">· file '+_dcEsc(P.ma)+'</span>':'')+' <span class="muted" style="font-weight:400">('+(P.layout==='A'?'mẫu CHECK_LIST':'mẫu PKL')+' · cập nhật '+_dcEsc(P.meta&&P.meta.upd||'')+')</span></h3><div style="margin:6px 0 10px">';
  tabs.forEach(function(t){h+='<button class="qf'+(_dcPane===t[0]?' on':'')+'" onclick="_dcSetPane(\''+t[0]+'\')">'+t[1]+(t[0]==='rev'&&P.rev.n?' ('+_dcN(P.rev.n)+')':'')+(t[0]==='dwg'&&_dcWsF?' ['+_dcEsc(_dcWsF)+']':'')+'</button> ';});
  h+='</div><div id="dcPane"></div>';
  el.innerHTML=h;
  var pane=document.getElementById('dcPane');
  if(_dcPane==='tq'){pane.innerHTML=_dcPaneTq(P);_dcTqCharts(P);}
  else if(_dcPane==='todo')pane.innerHTML=_dcPaneTodo(P);
  else if(_dcPane==='hs')pane.innerHTML=_dcPaneHs(P);
  else if(_dcPane==='grp')pane.innerHTML=_dcPaneGrp(P);
  else if(_dcPane==='ws')pane.innerHTML=_dcPaneWs(P);
  else if(_dcPane==='rfi')pane.innerHTML=_dcPaneRfi(P);
  else if(_dcPane==='dwg')pane.innerHTML=_dcPaneDwg(P);
  else if(_dcPane==='mem')_dcPaneMem(P);
  else if(_dcPane==='rev')pane.innerHTML=_dcPaneRev(P);
  else pane.innerHTML=_dcPaneSpm(P);
}

/* ---- 1) TỔNG QUAN DỰ ÁN ---- */
function _dcTqDimIdx(P){var d=_dcDims(P);return d.ms?0:(d.kv?1:2);}
function _dcTqDimLbl(P){var d=_dcDims(P);return d.ms?'Milestone':(d.kv?'Khu vực / Hạng mục':'Hạng mục');}
function _dcPaneTq(P){
  function box(v,l,s2,cls){return '<div style="flex:1;min-width:130px;background:var(--rowH);border-radius:12px;padding:10px 12px'+(cls==='bad'?';border-left:4px solid var(--bad)':cls==='warn'?';border-left:4px solid var(--warn)':cls==='good'?';border-left:4px solid var(--good)':'')+'"><div style="font-size:11px;color:var(--muted,#888)">'+l+'</div><div class="num" style="font-size:20px;font-weight:800">'+v+'</div><div style="font-size:11px" class="muted">'+(s2||'')+'</div></div>';}
  var remN=P.finNot.n,remT=P.finNot.t,fitRem=P.fitReq.n-P.fitInv.n;
  var h='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+
    box(_dcN(P.mem),'Cấu kiện (cây)',fm1(P.tan)+' t · '+_dcN(P.dwg)+' bản vẽ')+
    box(_dcN(P.weld.n)+' / '+_dcN(P.khan.n),'Có hàn / Không hàn',fm1(P.weld.t)+' t hàn · '+fm1(P.khan.t)+' t k.hàn')+
    box(_dcN(P.fitInv.n)+' / '+_dcN(P.fitReq.n),'FITUP — mời / cần (cây hàn)','CHƯA mời fitup '+_dcN(fitRem)+' cây')+
    box(_dcN(P.finInv.n),'FINAL (DIM+VIS) — đã mời',fm1(P.finInv.t)+' t · '+_dcPc(P.finInv.n,P.mem)+'%','good')+
    box(_dcN(remN),'CHƯA mời FINAL',fm1(remT)+' t (hàn + k.hàn)','warn')+
    box(_dcN(P.od?P.od.n:0),'Quá hạn KH cắt',fm1(P.od?P.od.t:0)+' t chưa mời final',P.od&&P.od.n?'bad':'')+
    (P.caps.finDone?box(_dcN(P.finDone.n),'Đã NT final (DIR/VIR)',fm1(P.finDone.t)+' t · NDT '+_dcN(P.ndt?P.ndt.n:0)+' cây','good'):'')+
    (P.caps.hoso?box(_dcN(P.bgHs.n),'Bàn giao hồ sơ','trình kí DDC '+_dcN(P.kiDDC.n)+' · kí KH '+_dcN(P.kiKH.n)):'')+
    (P.caps.fitQA?box(_dcN(P.fitQA.n),'Bàn giao QA (fitup)',fm1(P.fitQA.t)+' t'):'')+
    box(_dcN(P.rev.n),'Cảnh báo rev',_dcN(P.moiLai.n)+' cây mời lại',P.rev.n?'bad':'')+
    '</div><div class="r2"><div><div class="cg-lbl" style="margin-bottom:4px">Chuỗi hồ sơ — số cấu kiện qua từng bước</div><div id="dcTqFun" class="ch" style="height:280px"></div></div>'+
    '<div><div class="cg-lbl" style="margin-bottom:4px">Theo '+_dcTqDimLbl(P)+' — đã mời / chưa mời (tấn)</div><div id="dcTqMs" class="ch" style="height:280px"></div></div></div>'+
    '<div class="q" style="margin-top:6px">Bấm thẻ <b>Hạng mục · Milestone</b> để xem đã mời/chưa mời theo từng hạng mục, phase, milestone · thẻ <b>Tra cứu cấu kiện</b> để xem hồ sơ từng cây.</div>';
  return h;
}
function _dcTqCharts(P){
  _dcChReset('dcTqFun');_dcChReset('dcTqMs');
  var steps=[['Tổng cấu kiện',P.mem]];
  if(P.fitReq.n){steps.push(['Cần fitup (hàn)',P.fitReq.n]);steps.push(['Đã mời fitup',P.fitInv.n]);
    if(P.fitRep.n)steps.push(['Có report FUR',P.fitRep.n]);
    if(P.caps.fitQA)steps.push(['Bàn giao QA fitup',P.fitQA.n]);}
  steps.push(['Đã mời NT final (DIM+VIS)',P.finInv.n]);
  if(P.caps.finDone)steps.push(['Đã NT final (DIR/VIR)',P.finDone.n]);
  if(P.caps.ndt&&P.ndt&&P.ndt.n)steps.push(['Có hồ sơ NDT (MT/UT)',P.ndt.n]);
  if(P.caps.hoso){steps.push(['Trình kí DDC',P.kiDDC.n]);steps.push(['Trình kí khách hàng',P.kiKH.n]);steps.push(['Bàn giao hồ sơ',P.bgHs.n]);}
  steps.reverse();
  setOpt('dcTqFun',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return _dcN(v)+' cây';}},
    grid:{left:8,right:44,top:8,bottom:8,containLabel:true},
    xAxis:{type:'value'},yAxis:{type:'category',data:steps.map(function(s2){return s2[0];}),axisLabel:{fontSize:11,fontWeight:700}},
    series:[{type:'bar',barMaxWidth:16,itemStyle:{color:grad('#60A5FA','#2563EB'),borderRadius:[0,3,3,0]},
      label:{show:true,position:'right',fontWeight:800,formatter:function(p2){return _dcN(p2.value)+' ('+_dcPc(p2.value,P.mem)+'%)';}},
      data:steps.map(function(s2){return s2[1];})}]});
  var di=_dcTqDimIdx(P);
  var MS={};Object.keys(P.byGrp||{}).forEach(function(k){var g=P.byGrp[k],ms=k.split('‖')[di]||'—';
    if(ms==='?')ms='—';
    var o=MS[ms]||(MS[ms]={t:0,invT:0});o.t+=g.tan;o.invT+=g.finInvT||0;});
  var mss=Object.keys(MS).sort();
  if(mss.length>14){mss=Object.keys(MS).sort(function(a,b){return MS[b].t-MS[a].t;}).slice(0,14).reverse();}
  setOpt('dcTqMs',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return fm1(v)+' t';}},legend:{top:0},
    grid:{left:8,right:34,top:26,bottom:8,containLabel:true},
    xAxis:{type:'value',name:'tấn'},yAxis:{type:'category',data:mss,axisLabel:{fontWeight:700}},
    series:[{name:'Đã mời',type:'bar',stack:'s',barMaxWidth:16,itemStyle:{color:grad('#22C55E','#15803D')},data:mss.map(function(m2){return +MS[m2].invT.toFixed(1);})},
            {name:'Chưa mời',type:'bar',stack:'s',itemStyle:{color:document.documentElement.dataset.theme==='dark'?'#4a3d2a':'#FED7AA'},
             label:{show:true,position:'right',fontWeight:800,formatter:function(p2){var m2=mss[p2.dataIndex];return _dcPc(MS[m2].invT,MS[m2].t)+'%';}},
             data:mss.map(function(m2){return +(MS[m2].t-MS[m2].invT).toFixed(1);})}]});
}

/* ---- 2) HẠNG MỤC · MILESTONE · PHASE ---- */
function _dcPaneGrp(P){
  var av=_dcDims(P);
  var dims=[['ms','Milestone'],['kv','Khu vực'],['hm','Hạng mục'],['ph','Phase'],['all','Chi tiết đủ']]
    .filter(function(d2){return d2[0]==='all'||av[d2[0]];});
  if(!dims.some(function(d2){return d2[0]===_dcGrpBy;}))_dcGrpBy=dims.length?dims[0][0]:'all';
  var h=_dcXlsBtn('grp_'+P.ma,'HangMuc_'+P.ma)+'<div style="margin-bottom:6px"><span class="cg-lbl">Nhóm theo:</span> ';
  dims.forEach(function(d2){h+='<button class="qf'+(_dcGrpBy===d2[0]?' on':'')+'" onclick="_dcGrpBy=\''+d2[0]+'\';_dcRender()">'+d2[1]+'</button> ';});
  h+='</div>';
  var G={};var idx={ms:0,kv:1,hm:2,ph:3}[_dcGrpBy];
  Object.keys(P.byGrp||{}).forEach(function(k){var g=P.byGrp[k],p4=k.split('‖');
    var key=_dcGrpBy==='all'?k:(p4[idx]||'—');if(key==='?')key='—';
    var o=G[key]||(G[key]={mem:0,tan:0,han:0,fitReq:0,fitInv:0,finInv:0,finInvT:0,finDone:0,bgHs:0,rev:0,od:0});
    o.mem+=g.mem;o.tan+=g.tan;o.han+=g.han||0;o.fitReq+=g.fitReq||0;o.fitInv+=g.fitInv||0;o.finInv+=g.finInv;o.finInvT+=g.finInvT||0;o.finDone+=g.finDone;o.bgHs+=g.bgHs;o.rev+=g.rev;o.od+=g.od||0;});
  var ks=Object.keys(G).sort(function(a,b){return G[b].tan-G[a].tan;});
  var lbl={ms:'Milestone',kv:'Khu vực (Module/Street)',hm:'Hạng mục',ph:'Phase',all:'Milestone ‖ Khu vực ‖ Hạng mục ‖ Phase'}[_dcGrpBy];
  var aoa=[[lbl,'Cây','Hàn','K.hàn','Tấn','Fitup mời/cần','Chưa mời FITUP','ĐÃ mời FINAL (cây)','ĐÃ mời FINAL (t)','CHƯA mời FINAL (cây)','CHƯA mời FINAL (t)','%','Quá hạn','Đã NT','BG hồ sơ','Rev ⚠']];
  h+='<div class="tw" style="max-height:460px"><table><thead><tr><th>'+lbl+'</th><th class="n">Cây</th><th class="n">Hàn</th><th class="n">Tấn</th><th class="n">FITUP mời/cần</th><th class="n" style="color:var(--warn)">Chưa mời FITUP</th><th class="n" style="color:var(--good)">ĐÃ mời FINAL</th><th class="n" style="color:var(--warn)">CHƯA mời FINAL</th><th style="min-width:100px">% mời</th><th class="n">Quá hạn</th><th class="n">Đã NT</th><th class="n">BG hồ sơ</th><th class="n">Rev ⚠</th></tr></thead><tbody>';
  ks.forEach(function(k){var g=G[k],rem=g.mem-g.finInv,remT=Math.max(g.tan-g.finInvT,0),pc=_dcPc(g.finInv,g.mem),fr=(g.fitReq||0)-(g.fitInv||0);
    var kd=_dcGrpBy==='all'?k.split('‖').map(_dcEsc).join(' <span class="muted">‖</span> '):'<b>'+_dcEsc(k)+'</b>';
    h+='<tr><td>'+kd+'</td><td class="n">'+_dcN(g.mem)+'</td><td class="n">'+_dcN(g.han||0)+'</td><td class="n">'+fm1(g.tan)+'</td>'+
      '<td class="n">'+_dcN(g.fitInv)+' / '+_dcN(g.fitReq)+'</td>'+
      '<td class="n">'+(fr?'<b style="color:var(--warn)">'+_dcN(fr)+'</b>':'0')+'</td>'+
      '<td class="n" style="color:var(--good)"><b>'+_dcN(g.finInv)+'</b> <span class="muted">('+fm1(g.finInvT)+' t)</span></td>'+
      '<td class="n" style="color:var(--warn)"><b>'+_dcN(rem)+'</b> <span class="muted">('+fm1(remT)+' t)</span></td>'+
      '<td>'+_dcBar(pc)+'</td><td class="n">'+(g.od?'<b style="color:var(--bad)">'+_dcN(g.od)+'</b>':'0')+'</td>'+
      '<td class="n">'+(P.caps.finDone?_dcN(g.finDone):'—')+'</td><td class="n">'+(P.caps.hoso?_dcN(g.bgHs):'—')+'</td>'+
      '<td class="n">'+(g.rev?'<b style="color:var(--bad)">'+_dcN(g.rev)+'</b>':'0')+'</td></tr>';
    aoa.push([k.replace(/‖/g,' | '),g.mem,g.han||0,g.mem-(g.han||0),+g.tan.toFixed(2),g.fitInv+'/'+g.fitReq,fr,g.finInv,+g.finInvT.toFixed(2),rem,+remT.toFixed(2),pc,g.od,g.finDone,g.bgHs,g.rev]);});
  _dcXlsData['grp_'+P.ma]=aoa;
  return h+'</tbody></table></div><div class="q" style="margin-top:4px">'+lbl+' lấy từ sheet dự án · ĐÃ/CHƯA mời tính theo thư mời nghiệm thu final (DIM+VISUAL) gửi khách hàng.</div>';
}

/* ---- các pane còn lại ---- */
function _dcPaneWs(P){
  var aoa=[['Xưởng','Cây','Tấn','Fitup mời','Fitup cần','Final mời (cây)','Final mời (t)','Còn lại (cây)','Còn lại (t)','Quá hạn (cây)','Quá hạn (t)','Đã NT','BG hồ sơ','Rev ⚠']];
  var h=_dcXlsBtn('ws_'+P.ma,'Xuong_'+P.ma)+'<div class="q">Bấm 1 dòng xưởng để mở danh sách <b>bản vẽ</b> của xưởng đó.</div><div class="tw"><table><thead><tr><th>Xưởng</th><th class="n">Cây</th><th class="n">Tấn</th><th class="n">Fitup mời/cần</th><th class="n">Final đã mời</th><th class="n">Còn lại chưa mời</th><th class="n">Quá hạn KH cắt</th><th style="min-width:110px">% mời (t)</th><th class="n">Đã NT</th><th class="n">BG hồ sơ</th><th class="n">Rev ⚠</th></tr></thead><tbody>';
  var ks=Object.keys(P.byWs||{}).sort(function(a,b){return P.byWs[b].tan-P.byWs[a].tan;});

    var remN=w.mem-w.finInv,remT=Math.max(w.tan-(w.finInvT||0),0),pc=_dcPc(w.finInvT||0,w.tan);
    h+='<tr class="clickable" onclick="_dcWsFilter(\''+_dcEsc(k)+'\')"><td><b>'+_dcEsc(k)+'</b></td><td class="n">'+_dcN(w.mem)+'</td><td class="n"><b>'+fm1(w.tan)+'</b></td>'+
      '<td class="n">'+_dcN(w.fitInv)+' / '+_dcN(w.fitReq||0)+'</td>'+
      '<td class="n" style="color:var(--good)"><b>'+_dcN(w.finInv)+'</b> <span class="muted">('+fm1(w.finInvT||0)+' t)</span></td>'+
      '<td class="n" style="color:var(--warn)"><b>'+_dcN(remN)+'</b> <span class="muted">('+fm1(remT)+' t)</span></td>'+
      '<td class="n">'+(w.od?'<b style="color:var(--bad)">'+_dcN(w.od)+'</b> <span class="muted">('+fm1(w.odT||0)+' t)</span>':'0')+'</td>'+
      '<td>'+_dcBar(pc)+'</td>'+
      '<td class="n">'+(P.caps.finDone?_dcN(w.finDone):'—')+'</td><td class="n">'+(P.caps.hoso?_dcN(w.bgHs):'—')+'</td>'+
      '<td class="n">'+(w.rev?'<b style="color:var(--bad)">'+_dcN(w.rev)+'</b>':'0')+'</td></tr>';
    aoa.push([k,w.mem,w.tan,w.fitInv,w.fitReq||0,w.finInv,w.finInvT||0,remN,+remT.toFixed(2),w.od||0,w.odT||0,w.finDone,w.bgHs,w.rev]);});
  _dcXlsData['ws_'+P.ma]=aoa;
  return h+'</tbody></table></div><div class="q" style="margin-top:6px">Quá hạn = đã qua ngày <b>kế hoạch cắt</b> mà chưa mời nghiệm thu final.</div>';
}
function _dcPaneRfi(P){

  var h=_dcXlsBtn('rfi_'+P.ma,'RFI_'+P.ma)+'<div class="q">Mỗi dòng = 1 thư mời RFI đã gửi khách hàng · '+_dcN((P.rfi||[]).length)+' thư</div><div class="tw" style="max-height:440px"><table><thead><tr><th>RFI No.</th><th>Loại</th><th>Ngày</th><th class="n">Cây</th><th class="n">Tấn</th><th>QC</th></tr></thead><tbody>';
  (P.rfi||[]).slice(0,400).forEach(function(r){
    h+='<tr><td>'+_dcEsc(r[0])+(/-R\d+$/i.test(r[0])?' <span class="tag o">mời lại</span>':'')+'</td><td><span class="tag '+(r[1]==='FITUP'?'b':'g')+'">'+r[1]+'</span></td><td>'+_dcEsc(r[4])+'</td><td class="n">'+_dcN(r[2])+'</td><td class="n">'+fm1(r[3])+'</td><td>'+_dcEsc(r[5])+'</td></tr>';});
  (P.rfi||[]).forEach(function(r){aoa.push([r[0],r[1],r[4],r[2],r[3],r[5]]);});
  _dcXlsData['rfi_'+P.ma]=aoa;
  return h+'</tbody></table></div>';
}
function _dcPaneDwg(P){
  var list=(P.byDwg||[]);

/* ---- 3) TRA CỨU TỪNG CẤU KIỆN (live) ---- */
function _dcEnsureSel(P){
  if(P.sel)return Promise.resolve(P.sel);
  var sid=P.meta&&P.meta.sid;if(!sid)return Promise.reject(new Error('thiếu Spreadsheet ID — bấm ↻ Tải lại'));
  var tab='CHECK_LIST';
  return _dcFetch(_dcUrl(sid,'sheet='+encodeURIComponent('DOI CHIEU')+'&tq='+encodeURIComponent('limit 5')))
  .then(function(dc){for(var i=0;i<dc.length;i++){var v=String(dc[i][0]||'').trim();if(v&&!/tab du lieu/i.test(v)){tab=v;break;}}},function(){})
  .then(function(){return _dcFetch(_dcUrl(sid,'sheet='+encodeURIComponent(tab)+'&tq='+encodeURIComponent('limit 8')));})
  .then(function(probe){
    var layout=DDC_CORE.detectLayout(probe);if(!layout)throw new Error('layout chưa hỗ trợ');
    var M=DDC_CORE.buildMap(probe,layout);
    var keys=[],k;for(k in M){if(k.charAt(0)!=='_'&&M[k]>=0)keys.push(k);}
    var idxs=[];keys.forEach(function(kk){if(idxs.indexOf(M[kk])<0)idxs.push(M[kk]);});idxs.sort(function(a,b){return a-b;});
    var pos={},M2={};idxs.forEach(function(v,i){pos[v]=i;});
    for(k in M){if(k.charAt(0)==='_')continue;M2[k]=(M[k]>=0&&pos[M[k]]!=null)?pos[M[k]]:-1;}
    M2._dmy=true;
    P.sel={letters:idxs.map(_dcColL).join(','),pnL:_dcColL(M.pn),dwgL:M.dwg>=0?_dcColL(M.dwg):_dcColL(M.pn),tab:tab,map:M2};
    P.layout=P.layout||layout;
    return P.sel;});
}
function _dcMemFetch(P,where,desc){

  _dcPane='mem';_dcDetail();

    var q='select '+sel.letters+' where '+where+' limit 400';
    return _dcFetch(_dcUrl(P.meta.sid,'sheet='+encodeURIComponent(sel.tab)+'&tq='+encodeURIComponent(q)));
  }).then(function(rows){
    var out=[];

  _dcEnsureSel(P).then(function(sel){_dcMemFetch(P,'upper('+sel.pnL+") contains '"+q+"'",'Cấu kiện chứa "'+q+'"');},function(e){alert(String(e&&e.message||e));});}
function _dcStep(m,P){
  if(m.bgHs)return ['Đã bàn giao hồ sơ','g'];
  if(m.kiKH)return ['Đã trình kí khách hàng','g'];
  if(m.kiDDC)return ['Đang trình kí DDC','b'];
  if(m.finDone)return ['Đã NT final — chờ hồ sơ','g'];
  if(P.layout==='B'&&m.finInv&&m.finQc)return ['Đã mời final · QC '+m.finQc,'g'];
  if(m.finInv)return ['Đã mời NT final','b'];
  if(m.fitQA)return ['Fitup xong — bàn giao QA','b'];
  if(m.fitRep)return ['Fitup xong (FUR)','b'];
  if(m.fitInv)return ['Đã mời fitup','b'];
  if(m.weld)return ['CHƯA mời (cần fitup)','o'];
  return ['CHƯA mời nghiệm thu','o'];
}

var _dcMod='tq',_dcF={pj:-1,dim:'',val:''},_dcDocF='',_dcDocPage=0,_dcPjView='table';
var _DC_C={done:'#16a34a',proc:'#2563eb',pend:'#eab308',soon:'#f97316',od:'#dc2626',rev:'#7c3aed',gray:'#9ca3af'};
function _dcOptR(id,opt,cb){_dcChReset(id);var el=document.getElementById(id);if(!el)return;setOpt(id,opt,cb);}
function _dcMK(tot,tan,done,fin,od,soon,rev){od=od||0;soon=soon||0;
  var proc=Math.max(fin-done,0),pend=Math.max(tot-fin-od-soon,0);
  return {tot:tot,tan:tan,done:done,proc:proc,pend:pend,od:od,soon:soon,rev:rev||0,fin:fin,pct:tot?Math.round(done*100/tot):0,pctInv:tot?Math.round(fin*100/tot):0};}
function _dcStatOf(P,f){
  if(!P||P.err)return null;
  var doneOf=function(bg,fd){return P.caps.hoso?bg:(P.caps.finDone?fd:0);};
  if(f&&f.dim==='ws'){var w=(P.byWs||{})[f.val];if(!w)return _dcMK(0,0,0,0,0,0,0);
    return _dcMK(w.mem,w.tan,doneOf(w.bgHs,w.finDone),w.finInv,w.od,w.soon,w.rev);}
  if(f&&(f.dim==='kv'||f.dim==='hm')){var idx=f.dim==='kv'?1:2,a={m:0,t:0,d:0,f:0,o:0,s:0,r:0};
    Object.keys(P.byGrp||{}).forEach(function(k){var p=k.split('‖');if(p[idx]===f.val){var g=P.byGrp[k];
      a.m+=g.mem;a.t+=g.tan;a.d+=doneOf(g.bgHs,g.finDone);a.f+=g.finInv;a.o+=g.od||0;a.s+=g.soon||0;a.r+=g.rev;}});
    return _dcMK(a.m,a.t,a.d,a.f,a.o,a.s,a.r);}
  return _dcMK(P.mem,P.tan,doneOf(P.bgHs.n,P.finDone.n),P.finInv.n,P.od?P.od.n:0,P.soon?P.soon.n:0,P.rev.n);}
function _dcAgg(){var T=_dcMK(0,0,0,0,0,0,0);T.tan=0;
  (DDC.projects||[]).forEach(function(P,i){if(P.err)return;if(_dcF.pj>=0&&_dcF.pj!==i)return;
    var s=_dcStatOf(P,_dcF.dim?_dcF:null);if(!s)return;
    T.tot+=s.tot;T.tan+=s.tan;T.done+=s.done;T.proc+=s.proc;T.pend+=s.pend;T.od+=s.od;T.soon+=s.soon;T.rev+=s.rev;T.fin+=s.fin;});
  T.pct=T.tot?Math.round(T.done*100/T.tot):0;return T;}
function _dcDimVals(dim){var st={};
  (DDC.projects||[]).forEach(function(P){if(P.err)return;
    if(dim==='ws')Object.keys(P.byWs||{}).forEach(function(k){st[k]=1;});
    else Object.keys(P.byGrp||{}).forEach(function(k){var v=k.split('‖')[dim==='kv'?1:2];if(v&&v!=='?')st[v]=1;});});
  return Object.keys(st).sort();}
function _dcHealth(P){var s=_dcStatOf(P);if(!s)return ['⚪','gray'];
  if(s.od>s.tot*0.1||s.rev>0)return ['🔴','od'];
  if(s.od>0||s.soon>0)return ['🟡','soon'];
  return ['🟢','done'];}
function _dcSetMod(m){_dcMod=m;if(m!=='pj')_dcSel=(m==='pj'?_dcSel:_dcSel);_dcRender();}
function _dcSetF(k,v){if(k==='pj'){_dcF.pj=parseInt(v,10);}else if(k==='dim'){var p=v.split('§');if(!p[1]){_dcF.dim='';_dcF.val='';}else{_dcF.dim=p[0];_dcF.val=p[1];}}_dcRender();}
function _dcResetF(){_dcF={pj:-1,dim:'',val:''};_dcRender();}
function _dcGo(pj,type,q){_dcSel=pj;_dcMod='pj';_dcRender();

function _dcKpiGo(st){_dcDocF=st;_dcDocPage=0;_dcMod='doc';_dcRender();}
function _dcChip(t,cls){var c={done:'g',proc:'b',pend:'o',soon:'o',od:'',rev:''}[cls];
  var col={done:_DC_C.done,proc:_DC_C.proc,pend:_DC_C.pend,soon:_DC_C.soon,od:_DC_C.od,rev:_DC_C.rev,gray:_DC_C.gray}[cls]||_DC_C.gray;

  var main=document.getElementById('dcMain');if(!main)return;
  if(_dcMod==='tq')_dcModTq(main);

  _dcOptR('dcDonut',{tooltip:{trigger:'item',formatter:function(p){return p.name+': <b>'+_dcN(p.value)+'</b> ('+p.percent+'%)';}},

function _dcDocPred(P,d){
  switch(_dcDocF){
    case 'done':return P.caps.hoso?d[7]>0:d[6]>0;
    case 'inv':return d[5]>0;
    case 'not':return d[5]<d[2];
    case 'od':return (d[12]||0)>0;
    case 'soon':return (d[14]||0)>0;
    case 'rev':return d[8]>0;
    default:return true;}}

  var P=(_dcF.pj>=0?DDC.projects[_dcF.pj]:null);

  h+='</div>';
  if(!P){main.innerHTML=h+'<div class="card"><div class="q">Chọn một dự án để xem danh sách hồ sơ theo bản vẽ — hoặc gõ mã cấu kiện để tra trực tiếp. Trạng thái đang lọc: '+(_dcDocF||'tất cả')+'</div></div>';return;}

    '<div class="tw" style="max-height:460px"><table><thead><tr><th>Bản vẽ</th><th>Khu vực</th><th>Xưởng</th><th class="n">Cây</th><th class="n">Tấn</th><th>Trạng thái</th><th style="min-width:96px">% mời</th><th class="n" style="color:'+_DC_C.od+'">Quá hạn</th><th class="n" style="color:'+_DC_C.soon+'">Sắp hạn</th><th class="n" style="color:'+_DC_C.rev+'">Rev⚠</th><th>Mời cuối</th></tr></thead><tbody>';
  pg.forEach(function(d){var st,cls;

    else if(d[12]){st='Quá hạn';cls='od';}

  h+='</div></div>';
  main.innerHTML=h;
}

    (DDC.projects||[]).forEach(function(P){if(P.err)return;var s=_dcStatOf(P),nm=_dcSpmName(P);
      aoa.push([nm.code||'',nm.full||P.ma,P.ma,P.layout,s.tot,s.tan,s.done,s.proc,s.pend,s.od,s.soon,s.rev,s.pctInv]);});}

        aoa.push([x,nm.full||P.ma,w.mem,w.han||0,w.tan,w.fitInv,w.fitReq||0,w.finInv,w.finInvT||0,w.od||0,w.soon||0,w.rev]);});});}
  else if(kind==='rev'){aoa=[['Dự án','Cấu kiện','Bản vẽ','Rev hiện hành','Rev đã NT','Pha','RFI','Xưởng']];
    (DDC.projects||[]).forEach(function(P){if(P.err)return;var nm=_dcSpmName(P);
      (P.warnList||[]).forEach(function(w){aoa.push([nm.full||P.ma,w[0],w[1],w[2],w[3],w[4],w[5],w[6]]);});});}
  else if(kind==='od'){aoa=[['Dự án','Bản vẽ','Khu vực','Xưởng','Cây','Quá hạn','Sắp hạn','Đã mời','Tấn']];
    (DDC.projects||[]).forEach(function(P){if(P.err)return;var nm=_dcSpmName(P);
      (P.byDwg||[]).forEach(function(d){if(d[12]||d[14])aoa.push([nm.full||P.ma,d[0],d[1],d[10]||'',d[2],d[12]||0,d[14]||0,d[5],d[3]]);});});}
  else if(kind==='rfi'){aoa=[['Dự án','RFI/BB số','Loại','Ngày','Cây','Tấn','QC']];
    (DDC.projects||[]).forEach(function(P){if(P.err)return;var nm=_dcSpmName(P);
      (P.rfi||[]).forEach(function(r){aoa.push([nm.full||P.ma,r[0],r[1],r[4],r[2],r[3],r[5]]);});});}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),kind.toUpperCase());
  XLSX.writeFile(wb,'DDC_BaoCao_'+kind+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

  var pc=Math.round(doneCnt*100/steps.length);
  wrap.innerHTML='<div onclick="_dcCloseDrawer()" style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:998"></div>'+
    '<div style="position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--card,#fff);z-index:999;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding:16px;overflow:auto">'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">'+_dcEsc(m.pn)+'</b><button class="qf" onclick="_dcCloseDrawer()">✕ Đóng</button></div>'+
    '<div style="margin:6px 0 10px">'+_dcChip(st[0],st[1]==='g'?'done':st[1]==='b'?'proc':'pend')+(m.revWarn?' '+_dcChip('LỆCH REV — MỜI LẠI','rev'):'')+(m.moiLai?' '+_dcChip('Mời lại','soon'):'')+'</div>'+
    '<div style="background:var(--rowH,#f7f8fa);border-radius:10px;padding:10px;margin-bottom:10px">'+
      fld('Dự án',_dcSpmName(P).disp)+fld('Bản vẽ',m.dwg)+fld('Khu vực',m.grp1)+fld('Hạng mục',m.grp2)+fld('Milestone',m.ms)+fld('Phase',m.ph)+
      fld('Xưởng',m.ws)+fld('KL (kg)',String(m.w))+fld('Hàn',m.weld?'Có hàn':'Không hàn')+fld('Rev hiện hành',m.rev!=null?String(m.rev):'')+
    '</div>'+
    '<div class="cg-lbl">Tiến độ hồ sơ</div><div style="margin:4px 0 8px">'+_dcBar(pc)+'</div>'+
    '<div class="cg-lbl">Quy trình</div><div style="margin:4px 0 10px">'+tl+'</div>'+
    '<div style="background:var(--rowH,#f7f8fa);border-radius:10px;padding:10px;margin-bottom:10px">'+
      fld('RFI/BB final',m.finRfi)+fld('Ngày mời final',m.finD?ds(m.finD):'')+fld('Rev đã NT',m.finRev!=null?String(m.finRev):'')+fld('QC',m.finQc)+
      fld('RFI fitup',m.fitRfi)+fld('Report FUR',m.fitRep)+fld('DIR',m.dir)+fld('VIR',m.vir)+
    '</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      (P.meta&&P.meta.sid?'<a class="qf on" style="text-decoration:none" target="_blank" href="https://docs.google.com/spreadsheets/d/'+P.meta.sid+'/edit">Mở sheet DATA ▸</a>':'')+
      '<button class="qf" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+_dcEsc(m.pn)+'\')">📋 Copy mã</button>'+
    '</div></div>';
  wrap.style.display='block';
}

function _docSearch(q){

  q=nf(q);var qU=q.toUpperCase();

  var hit=-1;(DDC.projects||[]).forEach(function(P,i){if(hit>=0||P.err)return;

  if(hit>=0){_dcSel=hit;_dcMod='pj';_dcPane='tq';_dcRender();return;}
  /* 2) coi như mã cấu kiện: cần 1 dự án đang chọn hoặc tra ở tất cả? -> tra ở dự án chọn nhanh, nếu chưa chọn thì hỏi */

}

<script>

 ['pj','📁','Project Control','Danh mục & chi tiết dự án'],
 ['pz','🗺️','Phase / Zone','Ma trận Phase × Zone'],
 ['comp','🧩','Component','Danh sách & trạng thái cấu kiện'],

  var src=document.getElementById('dcSrc');

  var nav=document.getElementById('dcNav');

  var main=document.getElementById('dcMain');if(!main)return;

  else if(_dcMod==='insp')_dcModInsp(main);
  else if(_dcMod==='docctl')_dcModDocctl(main);
  else if(_dcMod==='rev')_dcModRev(main);
  else if(_dcMod==='ship')_dcModShip(main);

}
/* ---------- 03 PHASE / ZONE MATRIX ---------- */
function _dcModPz(main){
  var pi=_dcPjOf();if(pi<0){main.innerHTML='<div class="card q">Chưa có dự án.</div>';return;}
  var P=DDC.projects[pi];
  var h='<div class="card" style="padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    '<select onchange="_dcSetF(\'pj\',this.value)" style="padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;max-width:260px">';
  (DDC.projects||[]).forEach(function(Q,i){if(Q.err)return;h+='<option value="'+i+'"'+(pi===i?' selected':'')+'>'+_dcEsc(_dcSpmName(Q).disp)+'</option>';});
  h+='</select><span class="cg-lbl">Hàng:</span>';
  [['ms','Milestone'],['ph','Phase'],['hm','Hạng mục']].forEach(function(d){h+='<button class="qf'+(_dcPzRow===d[0]?' on':'')+'" onclick="_dcPzRow=\''+d[0]+'\';_dcRender()">'+d[1]+'</button>';});
  h+='<span class="cg-lbl">Chỉ số:</span>';
  var mets=[['fit','FITUP mời'],['fitRep','FITUP report'],['fin','FINAL mời'],['nt','Đã NT'],['ndt','NDT'],['doc','Hồ sơ BG']];
  mets.forEach(function(m){h+='<button class="qf'+(_dcPzMet===m[0]?' on':'')+'" onclick="_dcPzMet=\''+m[0]+'\';_dcRender()">'+m[1]+'</button>';});
  h+='<span class="q">xanh ≥90 · vàng 70–89 · cam 50–69 · đỏ &lt;50 (%) — bấm ô để mở danh sách cấu kiện khu vực đó</span></div>';
  var ri={ms:0,ph:3,hm:2}[_dcPzRow],rows={},cols={},cell={};
  Object.keys(P.byGrp||{}).forEach(function(k){var p=k.split('‖'),g=P.byGrp[k];

  var rks=Object.keys(rows).sort(),cks=Object.keys(cols).sort();
  function met(o){switch(_dcPzMet){

    var ta=0,tb=0;

  var h='<div class="kpis">'+
    kpi(tot?'bad':'',_dcN(tot),'Cấu kiện bị lệch REV','đã mời/NT ở rev cũ — bản vẽ đã nâng rev')+
    kpi('',_dcN(by.none),'Chưa kiểm tra gì','ảnh hưởng nhẹ — cập nhật bản vẽ là đủ')+
    kpi('',_dcN(by.fit),'Đã FITUP','cần kiểm tra lại fitup theo rev mới')+
    kpi('',_dcN(by.fin),'Đã FINAL / mời final','phải mời nghiệm thu lại')+
    kpi('',_dcN(by.ndt),'Đã NDT','xem lại hồ sơ NDT theo rev mới')+
    kpi(by.bg?'bad':'',_dcN(by.bg),'ĐÃ BÀN GIAO (CRITICAL)','hồ sơ đã giao khách ở rev cũ!')+
    '</div>';
  h+='<div class="card"><h3>Mức ảnh hưởng REV theo dự án</h3><div class="tw"><table><thead><tr><th>Dự án</th><th class="n">Tổng lệch REV</th><th class="n">Chưa KT</th><th class="n">Đã FITUP</th><th class="n">Đã FINAL</th><th class="n">Đã NDT</th><th class="n" style="color:var(--bad)">Đã bàn giao</th><th></th></tr></thead><tbody>';
  (DDC.projects||[]).forEach(function(P,i){if(P.err||!P.rev.n)return;var b=P.revBy||{};
    h+='<tr class="clickable" onclick="_dcSel='+i+';_dcMod=\'pj\';_dcPane=\'rev\';_dcRender()"><td><b>'+_dcEsc(_dcSpmName(P).disp)+'</b></td><td class="n"><b style="color:var(--bad)">'+_dcN(P.rev.n)+'</b></td><td class="n">'+_dcN(b.none||0)+'</td><td class="n">'+_dcN(b.fit||0)+'</td><td class="n">'+_dcN(b.fin||0)+'</td><td class="n">'+_dcN(b.ndt||0)+'</td><td class="n">'+(b.bg?'<b style="color:var(--bad)">'+_dcN(b.bg)+'</b>':'0')+'</td><td>Chi tiết ▸</td></tr>';});
  h+='</tbody></table></div><div class="q" style="margin-top:4px">REVISION MISMATCH = rev nghiệm thu &lt; rev bản vẽ hiện hành · nhóm theo bước xa nhất cấu kiện đã đi qua · bấm dòng xem danh sách từng cây.</div></div>';
  main.innerHTML=h;
}
/* ---------- 08 SHIPMENT / BÀN GIAO ---------- */
function _dcModShip(main){
  var h='<div class="q" style="margin:2px 0 8px">Sheet DATA hiện theo dõi đến bước <b>bàn giao hồ sơ / BBGN</b> (chưa có cột shipment xuất hàng riêng — số xuất hàng thực tế xem dashboard SPM). Trạng thái: Chưa đủ điều kiện → Đã NT → Đã bàn giao. <b>Critical</b> = đã bàn giao nhưng thiếu hồ sơ NDT.</div>';
  h+='<div class="card"><h3>Bàn giao theo dự án</h3><div class="tw"><table><thead><tr><th>Dự án</th><th class="n">Đã NT / đủ điều kiện</th><th class="n" style="color:var(--good)">Đã bàn giao</th><th class="n">Chưa bàn giao</th><th class="n" style="color:var(--bad)">BG thiếu NDT (Critical)</th><th class="n" style="color:var(--bad)">BG lệch REV (Critical)</th></tr></thead><tbody>';
  (DDC.projects||[]).forEach(function(P,i){if(P.err)return;
    var done=P.caps.finDone?P.finDone.n:P.finInv.n;
    var bg=P.caps.hoso?P.bgHs.n:(P.caps.fitQA?P.fitQA.n:0);
    var lbl=P.caps.hoso?'':' (QA fitup)';
    h+='<tr class="clickable" onclick="_dcSel='+i+';_dcMod=\'pj\';_dcPane=\'hs\';_dcRender()"><td><b>'+_dcEsc(_dcSpmName(P).disp)+'</b></td><td class="n">'+_dcN(done)+'</td><td class="n" style="color:var(--good)"><b>'+_dcN(bg)+'</b>'+lbl+'</td><td class="n">'+_dcN(Math.max(done-bg,0))+'</td><td class="n">'+(P.bgIssue&&P.bgIssue.n?'<b style="color:var(--bad)">'+_dcN(P.bgIssue.n)+'</b>':'—')+'</td><td class="n">'+(P.revBy&&P.revBy.bg?'<b style="color:var(--bad)">'+_dcN(P.revBy.bg)+'</b>':'0')+'</td></tr>';});
  h+='</tbody></table></div></div>';
  main.innerHTML=h;
}

_dcRender();
</script>
