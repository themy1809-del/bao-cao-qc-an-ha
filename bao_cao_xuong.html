<script>
(function(){
var D=window.QCDATA||{rows:[],P:[],X:[],PL:[]},PB=window.PHAN_BO_QC||{};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function vn(x,d){d=d||0;var s=(+x||0).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return s.join(',');}
function vt(x){return x<10&&x>0?vn(x,1):vn(x);}
function nfc(s){return String(s==null?'':s).normalize('NFC');}
function ma(p){return nfc(p).trim().split(/\s+/)[0]||'';}
function tenGon(p){return nfc(p).trim().replace(/^\S+\s+/,'').replace(/^(DGRP|DG)\s+/i,'');}
function hoaTen(s){return nfc(s).toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase();});}
var Q=new URLSearchParams(location.search);
var XS=(PB.KHU||[]).filter(function(k){return k.spmX&&!k.gop;}).map(function(k){return k.spmX;});
if(!XS.length)XS=(D.X||[]).filter(function(x){return /^AH\d/.test(x);});
var XUONG=(Q.get('x')||'AH3').toUpperCase();if(!/^AH\d$/.test(XUONG))XUONG='AH3';if(XS.indexOf(XUONG)<0)XS.push(XUONG);
/* thang chot: 21 thang truoc -> 20 thang nay */
function pad(n){return ('0'+n).slice(-2);}
function thangHienTai(){var t=new Date(),y=t.getFullYear(),m=t.getMonth()+1;if(t.getDate()>20){m++;if(m>12){m=1;y++;}}return y+'-'+pad(m);}
function ky(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7),py=m===1?y-1:y,pm=m===1?12:m-1;return {tu:py+'-'+pad(pm)+'-21',den:y+'-'+pad(m)+'-20',m:m,y:y};}
var THANG=/^\d{4}-\d{2}$/.test(Q.get('m')||'')?Q.get('m'):thangHienTai();
/* chon xuong / thang */
var sx=document.getElementById('selX'),sm=document.getElementById('selM');
XS.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;if(x===XUONG)o.selected=true;sx.appendChild(o);});
(function(){var cur=thangHienTai(),y=+cur.slice(0,4),m=+cur.slice(5,7);for(var i=0;i<6;i++){var v=y+'-'+pad(m),o=document.createElement('option');o.value=v;o.textContent='T'+m+'/'+y;if(v===THANG)o.selected=true;sm.appendChild(o);m--;if(m<1){m=12;y--;}}
  if(!sm.value){var o=document.createElement('option');o.value=THANG;o.textContent=THANG;o.selected=true;sm.appendChild(o);}})();
function di(){location.search='?x='+encodeURIComponent(sx.value)+'&m='+encodeURIComponent(sm.value);}
sx.onchange=di;sm.onchange=di;
document.getElementById('btIn').onclick=function(){window.print();};
document.getElementById('btTheme').onclick=function(){var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');};
/* ten QC tu phan_bo_qc.js */
var TEN={};function themNguoi(a){(a||[]).forEach(function(n){if(n.spm&&!TEN[n.spm])TEN[n.spm]=hoaTen(n.ten);});}
themNguoi(PB.NGUOI);(PB.TEAMS||[]).forEach(function(t){themNguoi(t.NGUOI);});
function tenQC(c){return TEN[c]||c;}
function tenNgan(c){var t=tenQC(c).split(' ');return t[t.length-1];}

/* ===== KHSX (cung sheet + cot nhu ban_do_qc.html) ===== */
var KHSX_SHEET='1kqMlDG4zJljpK9l6IpZf6-RAEdZj_CcwmliRcZgUMMs',KHSX_GID='0';
function _n(s){return nfc(s).toLowerCase().replace(/\s+/g,' ').trim();}
function _num(v){if(v==null)return 0;if(typeof v==='number')return isFinite(v)?v:0;
  var s=String(v).trim().replace(/\s|%/g,'');if(!s||s==='-')return 0;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))return parseFloat(s.replace(/,/g,''));
  if(/^-?\d+,\d+$/.test(s))return parseFloat(s.replace(',','.'));
  if(/^-?\d+\.\d{3}$/.test(s))return parseFloat(s.replace('.',''));
  var x=parseFloat(s.replace(/,/g,''));return isNaN(x)?0:x;}
function _csv(t){var out=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}else if(ch==='\n'){row.push(f);out.push(row);row=[];f='';}else if(ch!=='\r')f+=ch;}
  if(f||row.length){row.push(f);out.push(row);}return out;}
function chuanX(x){var m=String(x||'').toUpperCase().match(/AH\d/);return m?m[0]:'';}
/* -> KS[ma][xuong] = {ten, sl, kl, slR, klR, klH} (tan) */
function khTuBang(rows){
  function lbl(v){return _n(String(v==null?'':v).replace(/^[\d.,\s-]+/,''));}
  var hi=-1;for(var i=0;i<Math.min(rows.length,30);i++){if((rows[i]||[]).some(function(c){return lbl(c)==='tên dự án';})){hi=i;break;}}
  if(hi<0)throw new Error('không thấy dòng tiêu đề "Tên dự án"');
  var h=rows[hi].map(lbl);function c(k){var j=h.indexOf(_n(k));if(j>=0)return j;for(var t=0;t<h.length;t++)if(h[t].indexOf(_n(k))===0)return t;return -1;}
  var cP=c('Tên dự án'),cX=c('Xưởng gia công'),cSL=c('Tổng số lượng'),cKL=c('Tổng khối lượng'),cSR=c('TSL ráp hoàn thiện còn lại'),cR=c('TKL ráp hoàn thiện còn lại'),cH=c('TKL hàn hoàn thiện còn lại');
  if([cP,cX,cKL,cR,cH].some(function(z){return z<0;}))throw new Error('thiếu cột tên dự án / xưởng / KL / ráp HT / hàn HT còn lại');
  var KS={};
  for(var r=hi+1;r<rows.length;r++){var x=rows[r]||[];var p=nfc(x[cP]).trim();if(!p||lbl(p)==='tên dự án')continue;
    var m=ma(p),w=chuanX(x[cX])||'?';if(!KS[m])KS[m]={};if(!KS[m][w])KS[m][w]={ten:p,sl:0,kl:0,slR:0,klR:0,klH:0};var o=KS[m][w];
    o.sl+=cSL>=0?_num(x[cSL]):0;o.kl+=_num(x[cKL])/1000;o.slR+=cSR>=0?_num(x[cSR]):0;o.klR+=_num(x[cR])/1000;o.klH+=_num(x[cH])/1000;}
  return KS;}

/* ===== SPM ===== */
function spm(xw,K,KT){
  var iX=(D.X||[]).indexOf(xw),MI=(D.PL||[]).indexOf('Miễn QC'),tuTruoc=ky(THANG_TRUOC()).tu,A={},F={},tongF=0;
  (D.rows||[]).forEach(function(r){if(r[1]!==iX)return;var m=ma(D.P[r[0]]);
    var wd=r[4]||'',qd=r[3]||'';
    if((wd>=tuTruoc&&wd<=K.den)||(qd>=tuTruoc&&qd<=K.den)){var v=(+r[7]||0)+(+r[8]||0)+(+r[9]||0);if(v>0){A[m]=(A[m]||0)+v;if(!KT[m])KT[m]=D.P[r[0]];}}
    if(wd>=K.tu&&wd<=K.den&&r[6]!==MI&&(+r[7]||0)>0){F[m]=(F[m]||0)+(+r[7]);tongF+=+r[7];}});
  return {A:A,F:F,tongF:tongF};}
function THANG_TRUOC(){var y=+THANG.slice(0,4),m=+THANG.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+pad(m);}

function ve(KS,loi){
  var K=ky(THANG),KT={},S=spm(XUONG,K,KT);
  var PT=(PB.PHU_TRACH||[]).filter(function(p){return p.x===XUONG;});
  var CHAYTAY=((PB.DANG_CHAY||{})[XUONG]||[]);
  var ttPT={};PT.forEach(function(p){if(p.ma&&p.tt&&!ttPT[p.ma])ttPT[p.ma]=p.tt;});
  var tenPT={};PT.forEach(function(p){if(p.ma&&!tenPT[p.ma])tenPT[p.ma]=p.ten.replace(/\s+—\s+\d+\s*bộ$/,'');});
  function ks(m,w){return KS&&KS[m]&&KS[m][w]&&KS[m][w].kl>0.05?KS[m][w]:null;}
  function khac(m){if(!KS||!KS[m])return '';return Object.keys(KS[m]).filter(function(w){return w!==XUONG&&w!=='?'&&KS[m][w].klR>0.5;}).sort(function(a,b){return KS[m][b].klR-KS[m][a].klR;}).map(function(w){return w;})[0]||'';}
  /* --- muc 1: QC phu trach --- */
  var nhom=[],idx={},bo=[];
  PT.forEach(function(p){
    var t,cl;
    if(p.tt){t=p.tt;cl='am';}
    else if(p.khau==='Lắp thử'){t='Chưa có số liệu';cl='xam';}
    else if(!KS){t='—';cl='xam';}
    else{var z=ks(p.ma,XUONG);
      if(!z){var w=khac(p.ma);if(!p.giu){if(bo.indexOf(p.ten)<0)bo.push(p.ten);return;}
        t=w?'KHSX xếp '+w+' — còn ráp '+vt(KS[p.ma][w].klR)+' t':'KHSX chưa có';cl='am';}
      else{var rem=p.khau==='Final'?z.klH:(p.khau==='Fitup'?z.klR:z.klR+z.klH);
        if(rem<0.5){t='Xong';cl='xa';}else{t='Đang làm — còn '+(p.khau==='Fitup + Final'||p.khau==='Khác'?'ráp '+vt(z.klR)+' · hàn '+vt(z.klH):vt(rem))+' t';cl='am';}}}
    if(!(p.qc in idx)){idx[p.qc]=nhom.length;nhom.push({qc:p.qc,ds:[]});}
    nhom[idx[p.qc]].ds.push({ten:p.ten,khau:p.khau,t:t,cl:cl});});
  /* --- muc 2: du an tai xuong --- */
  /* chi dua vao du an KHSX co xep o xuong (user 04/11: chua co thi chua vao) va con KL / co rap trong thang / co QC phu trach; bo du an user da bo (BO_QUA) */
  var BOQ=((PB.BO_QUA||{})[XUONG]||[]),coQC={};PT.forEach(function(p){if(p.ma)coQC[p.ma]=1;});
  var set={};
  if(KS)Object.keys(KS).forEach(function(m){var z=KS[m][XUONG];if(!z||BOQ.indexOf(m)>=0)return;
    if((z.klR+z.klH)>=0.5||(S.F[m]||0)>0.05||coQC[m])set[m]=1;});
  else Object.keys(S.A).forEach(function(m){if(S.A[m]>0.5&&BOQ.indexOf(m)<0)set[m]=1;});
  CHAYTAY.forEach(function(m){if(BOQ.indexOf(m)<0)set[m]=1;});
  var qcMa={};PT.forEach(function(p){if(!p.ma)return;var a=qcMa[p.ma]=qcMa[p.ma]||[];var n=tenNgan(p.qc);if(a.indexOf(n)<0)a.push(n);});
  var DA=Object.keys(set).map(function(m){var z=KS&&KS[m]&&KS[m][XUONG];
    var ten=tenPT[m]||tenGon(z?z.ten:(KT[m]||m));
    var td=z&&z.kl>0.05?100*(1-z.klR/z.kl):null;
    return {m:m,ten:ten,sl:z?z.slR:null,r:z?z.klR:null,h:z?z.klH:null,f:S.F[m]||0,td:td,qc:qcMa[m]||[],chay:(S.A[m]>0.5||CHAYTAY.indexOf(m)>=0),xn:CHAYTAY.indexOf(m)>=0&&!(S.A[m]>0.5)};});
  DA.sort(function(a,b){return ((b.r||0)+(b.h||0))-((a.r||0)+(a.h||0));});
  var G1=DA.filter(function(d){return d.chay;}),G2=DA.filter(function(d){return !d.chay;});
  var conR=DA.reduce(function(s,d){return s+(d.r||0);},0);
  var nQC=nhom.length;
  /* --- HTML --- */
  var H=[];
  H.push('<div class="page"><h1>'+esc(XUONG)+' — Tháng '+K.m+'/'+K.y+'</h1><div class="sub">'+esc(K.tu.slice(8)+'/'+K.tu.slice(5,7))+' → '+esc(K.den.slice(8)+'/'+K.den.slice(5,7)+'/'+K.y)+' · SPM '+esc(D.updated||'?')+' · KHSX '+(KS?'đọc lúc '+esc(new Date().toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})):'<span class="do">chưa đọc được</span>')+'</div>');
  if(loi)H.push('<div class="msg"><b class="do">Không đọc được KHSX:</b> '+esc(loi)+'. Tình trạng và tiến độ theo KHSX tạm để trống.</div>');
  H.push('<div class="kp"><div><b>'+(KS?vn(conR)+' t':'—')+'</b><span>KHSX còn ráp tại xưởng</span></div><div><b>'+vn(S.tongF)+' t</b><span>Đã ráp trong tháng (SPM)</span></div><div><b>'+G1.length+'</b><span>Dự án đang chạy</span></div><div><b>'+nQC+'</b><span>QC phụ trách</span></div></div>');
  H.push('<h2>1. QC đang phụ trách</h2>');
  if(!nhom.length)H.push('<div class="msg xam">Chưa khai báo QC phụ trách cho xưởng này (mảng <b>PHU_TRACH</b> trong phan_bo_qc.js).</div>');
